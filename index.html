<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ASPHODEL</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --u: 3px; }                      /* one low-res (240p) pixel in CSS px, set from JS */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; }
  body { font-family: 'VT323', 'Courier New', monospace; color: #cfd6dc; }
  .hidden { display: none !important; }

  #stage { position: absolute; overflow: hidden; background: #000; }
  #view { display: block; width: 100%; height: 100%; }
  #ui { position: absolute; inset: 0; pointer-events: none; line-height: 1.1;
    font-size: max(calc(var(--u) * 12), 15px);
    text-shadow: max(calc(var(--u) * 1), 1px) max(calc(var(--u) * 1), 1px) 0 #000; }
  #ui > * { pointer-events: auto; }

  /* ---- title + menus ---- */
  #title { position: absolute; left: 0; right: 0; top: 11%; text-align: center; pointer-events: none; }
  #logo { width: 80%; image-rendering: pixelated; image-rendering: crisp-edges; }
  #footer { position: absolute; left: 3%; bottom: 2.5%; font-size: .7em; color: #5d6b78; pointer-events: none; }
  #menu { position: absolute; left: 50%; bottom: 10%; transform: translateX(-50%); min-width: 44%; }
  #menu.panel { bottom: auto; top: 50%; transform: translate(-50%, -50%); min-width: 66%; padding: .5em .4em .6em;
    background: linear-gradient(rgba(10,16,26,.93), rgba(4,8,14,.93)); border: max(var(--u), 1px) solid #8fa0ad;
    box-shadow: inset 0 0 0 max(var(--u), 1px) #1b2530, 0 0 0 max(var(--u), 1px) #000; }
  .menu-title { text-align: center; color: #a9c0cf; letter-spacing: .25em; margin-bottom: .35em; }
  .mi { display: flex; justify-content: space-between; align-items: center; gap: 1.2em; padding: .14em .7em;
    color: #7f8d99; cursor: pointer; white-space: nowrap; }
  .mi .mi-label::before { content: '\00a0\00a0'; }
  .mi.sel { color: #f2f6f8; background: linear-gradient(90deg, rgba(120,150,170,0), rgba(120,150,170,.3), rgba(120,150,170,0)); }
  .mi.sel .mi-label::before { content: '>\00a0'; }
  .mi.dis { color: #414b55; cursor: default; }
  .mi-val { display: flex; align-items: center; gap: .35em; }
  .mi-val i { font-style: normal; min-width: 5.2em; text-align: center; }
  .mi-val b { font-weight: normal; padding: 0 .45em; color: #a9c0cf; }
  .menu-help { margin: .45em .7em 0; font-size: .74em; color: #6f7f8c; white-space: normal; text-align: center; }

  /* ---- dialogue box ---- */
  #dialogue { position: absolute; left: 4%; right: 4%; bottom: 4%; min-height: 4.5em; padding: .45em .8em .55em;
    background: linear-gradient(rgba(10,16,26,.92), rgba(4,8,14,.92)); border: max(var(--u), 1px) solid #8fa0ad;
    box-shadow: inset 0 0 0 max(var(--u), 1px) #1b2530, 0 0 0 max(var(--u), 1px) #000; cursor: pointer; }
  .dlg-name { position: absolute; left: .6em; top: -1.25em; padding: 0 .5em; background: #0a1018; color: #a9c0cf;
    border: max(var(--u), 1px) solid #8fa0ad; }
  .dlg-body.inner { color: #c9d6de; }
  .dlg-body.speech { color: #f0f3f5; }
  .dlg-body.system { color: #d6c890; text-align: center; padding-top: .9em; }
  .dlg-rest { visibility: hidden; }
  .dlg-next { position: absolute; right: .7em; bottom: .35em; width: 0; height: 0; border-left: .32em solid transparent;
    border-right: .32em solid transparent; border-top: .42em solid #cfd6dc; animation: bob .8s steps(2) infinite; }
  .dlg-choices { margin-top: .2em; padding-left: 1.4em; }
  .dlg-choice { color: #7f8d99; padding: .03em .5em; }
  .dlg-choice::before { content: '\00a0\00a0'; }
  .dlg-choice.sel { color: #fff; }
  .dlg-choice.sel::before { content: '>\00a0'; }
  @keyframes bob { 50% { transform: translateY(calc(var(--u) * 2)); } }

  /* ---- in-game HUD ---- */
  #marker { position: absolute; width: 2.4em; height: 2.4em; margin: -2.9em 0 0 -1.2em; cursor: pointer; animation: bob 1s steps(2) infinite; }
  #marker i { position: absolute; left: 50%; top: 50%; width: .42em; height: .42em; margin: -.21em; transform: rotate(45deg);
    background: #e6edf1; box-shadow: 0 0 0 max(var(--u), 1px) #0a1018; }
  #hint { position: absolute; right: 3%; bottom: 3%; color: #b4c2cc; font-size: .85em; pointer-events: none; }
  #toast { position: absolute; left: 0; right: 0; top: 6%; text-align: center; color: #d6c890; pointer-events: none; }
  #boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 0 8%; color: #7f8d99; background: #000; }

  /* ---- touch controls (shown on touch devices only) ---- */
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; font-family: inherit; }
  body.touch #touch { display: block; }
  #touch > * { position: absolute; pointer-events: auto; touch-action: none; }
  #stick { left: max(18px, env(safe-area-inset-left)); bottom: 24px; width: 136px; height: 136px; border-radius: 50%;
    border: 2px solid rgba(200,215,225,.32); background: rgba(20,28,38,.34); }
  #knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px; border-radius: 50%;
    background: rgba(200,215,225,.42); border: 2px solid rgba(10,16,24,.5); }
  #btnA { right: max(22px, env(safe-area-inset-right)); bottom: 44px; width: 86px; height: 86px; border-radius: 50%;
    border: 2px solid rgba(200,215,225,.4); background: rgba(20,28,38,.4); color: rgba(225,235,240,.85);
    font-size: 24px; display: flex; align-items: center; justify-content: center; }
  #btnA.hot { background: rgba(120,150,170,.5); border-color: rgba(235,242,246,.8); }
  #btnMenu { right: max(10px, env(safe-area-inset-right)); top: max(8px, env(safe-area-inset-top)); width: 46px; height: 38px;
    border: 2px solid rgba(200,215,225,.3); background: rgba(20,28,38,.4); color: rgba(225,235,240,.8);
    font-size: 20px; display: flex; align-items: center; justify-content: center; letter-spacing: 2px; }
  body[data-state="title"] #stick, body[data-state="title"] #btnA, body[data-state="title"] #btnMenu,
  body[data-state="paused"] #stick, body[data-state="paused"] #btnA { display: none; }

  /* ---- speaker colours: Leta cold grey-blue, Mnema soft pink, monsters dim red ---- */
  #dialogue[data-voice="leta"] .dlg-body, #dialogue[data-voice="leta"] .dlg-name, #bark[data-voice="leta"] { color: #b3c8da; }
  #dialogue[data-voice="mnema"] .dlg-body, #dialogue[data-voice="mnema"] .dlg-name, #bark[data-voice="mnema"] { color: #f3b3c8; }
  #dialogue[data-voice="monster"] .dlg-body, #dialogue[data-voice="monster"] .dlg-name { color: #a23a3a; }
  #dialogue[data-voice="monster"] .dlg-body { letter-spacing: .14em; }
  #dialogue[data-voice="mnema"] .dlg-name { border-color: #b98a9a; }
  #dialogue[data-voice="monster"] .dlg-name { border-color: #6a2a2a; }
  #dialogue .dlg-choice { color: #64798a; }
  #dialogue .dlg-choice.sel { color: #dbe9f4; }

  /* ---- barks (non-blocking companion lines), chapter cards, cutscene letterbox ---- */
  #bark { position: absolute; left: 8%; right: 8%; bottom: 13%; text-align: center; pointer-events: none; }
  #card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .35em;
    pointer-events: none; color: #cfd6dc; letter-spacing: .3em; background: rgba(0,0,0,.6); }
  #card b { font-weight: normal; font-size: 1.5em; }
  #card i { font-style: normal; color: #8fa0ad; letter-spacing: .12em; }
  #ui .bar { position: absolute; left: 0; right: 0; height: 0; background: #000; transition: height .45s steps(6); pointer-events: none; }
  #ui .bar.top { top: 0; }
  #ui .bar.bot { bottom: 0; }
  body[data-cine="1"] #ui .bar { height: 8%; }
  body[data-cine="1"] #dialogue { bottom: 9%; }
  #btnA { font-size: 17px; letter-spacing: 1px; }
</style>
</head>
<body data-state="boot">
<div id="stage">
  <canvas id="view"></canvas>
  <div id="ui">
    <div id="title" class="hidden"><canvas id="logo" width="256" height="56"></canvas></div>
    <div id="footer" class="hidden">PROLOGUE + CHAPTER 1</div>
    <div id="menu" class="hidden"></div>
    <div id="marker" class="hidden"><i></i></div>
    <div id="hint" class="hidden"></div>
    <div id="toast" class="hidden"></div>
    <div class="bar top"></div><div class="bar bot"></div>
    <div id="bark" class="hidden"></div>
    <div id="card" class="hidden"><b></b><i></i></div>
    <div id="dialogue" class="hidden">
      <div class="dlg-name hidden"></div>
      <div class="dlg-body inner"><span class="dlg-shown"></span><span class="dlg-rest"></span></div>
      <div class="dlg-choices"></div>
      <div class="dlg-next hidden"></div>
    </div>
    <div id="boot">LOADING...</div>
  </div>
</div>
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div id="btnA">ACT</div>
  <div id="btnMenu">II</div>
</div>

<script>
  // Shown if the module below (or Three.js on the CDN) fails to load.
  window.addEventListener('error', function (e) {
    var b = document.getElementById('boot');
    if (b && !b.classList.contains('hidden')) b.textContent = 'Could not start: ' + (e.message || 'failed to load Three.js from the CDN. Check your connection.');
  }, true);
</script>

<script type="module">
/* =====================================================================================================
   ASPHODEL — a PS1-style third-person horror adventure (prologue + chapter 1)

   File map (search for the section headers):
     1. CONFIG / UTILS          constants, RNG, math helpers
     2. SETTINGS + SAVE SYSTEM  localStorage
     3. AUDIO                   procedural WebAudio (wind, drone, notes, steps, blips)
     4. TEXTURES                64x64 canvas textures, bitmap font for signs
     5. PS1 MATERIAL            vertex snap, affine warp, vertex lighting, fog
     6. GEOMETRY BUILDERS       loft / box / quad + StaticBatch with baked vertex lighting
     7. CHARACTERS              Leta, Mnema, the Hollow (segmented low-poly rigs) + procedural animation and poses
     8. SCENES                  registerScene(); 'city_entrance', 'main_street'
     9. CHAPTERS                registerChapter(); 'prologue', 'chapter1'   <-- add Chapter 2 here
    10. RENDERER + POST         240p target, dither, grain, VHS, scanlines
    11. INPUT                   keyboard + mouse, gamepad, touch stick / drag-look
    12. DIALOGUE UI             typewriter text box, choices
    13. MENUS                   title, settings, pause
    14. GAME CORE               actors, third-person camera + collision, follower AI, triggers, scripts
    15. BOOT
   ===================================================================================================== */
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
THREE.ColorManagement.enabled = false;          // colours are authored display-referred, no conversions

/* ============================== 1. CONFIG / UTILS ============================== */
const CFG = {
  lowH: 240, aspectMin: 4 / 3, aspectMax: 16 / 9,
  walkSpeed: 1.55, runSpeed: 3.5, playerRadius: 0.28,
  camDist: 2.6, camHeight: 1.42, camShoulder: .4, camFov: 55,      // over-the-shoulder follow camera
  saveKey: 'asphodel.save.v1', settingsKey: 'asphodel.settings.v1',
};
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const sh = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
const sleep = s => new Promise(r => setTimeout(r, s * 1000));
function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function hash2(x, y) { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
/** Tileable value noise (lattice wraps every px/py cells). */
function vnoiseP(x, y, px, py = px) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const s = t => t * t * (3 - 2 * t), w = (i, p) => ((i % p) + p) % p;
  const a = hash2(w(xi, px), w(yi, py)), b = hash2(w(xi + 1, px), w(yi, py));
  const c = hash2(w(xi, px), w(yi + 1, py)), d = hash2(w(xi + 1, px), w(yi + 1, py));
  return lerp(lerp(a, b, s(xf)), lerp(c, d, s(xf)), s(yf));
}
/** Shortest signed angle from a to b. */
function angDiff(a, b) { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; }
function M(x = 0, y = 0, z = 0, ry = 0, rx = 0, rz = 0, s = 1) {
  return new THREE.Matrix4().compose(new THREE.Vector3(x, y, z),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz, 'YXZ')), new THREE.Vector3(s, s, s));
}
const mul = (...ms) => ms.reduce((a, b) => a.clone().multiply(b));

/* ============================== 2. SETTINGS + SAVE SYSTEM ============================== */
const Settings = {
  data: { volume: 7, sens: 5, invertY: false, pixel: true },
  load() { try { Object.assign(this.data, JSON.parse(localStorage.getItem(CFG.settingsKey) || '{}')); } catch (e) { /* storage unavailable */ } },
  save() { try { localStorage.setItem(CFG.settingsKey, JSON.stringify(this.data)); } catch (e) { /* storage unavailable */ } },
};
const SaveSystem = {
  read() { try { const d = JSON.parse(localStorage.getItem(CFG.saveKey)); return d && d.version === 1 ? d : null; } catch (e) { return null; } },
  exists() { return !!this.read(); },
  /** Snapshot of everything a chapter needs to resume: where, facing, flags, playtime. */
  write(G) {
    const d = { version: 1, chapter: G.chapter, scene: G.sceneId, x: G.player.x, z: G.player.z, heading: G.player.heading,
      flags: { ...G.flags }, playtime: Math.round(G.playtime), savedAt: Date.now() };
    try { localStorage.setItem(CFG.saveKey, JSON.stringify(d)); return true; } catch (e) { return false; }
  },
  clear() { try { localStorage.removeItem(CFG.saveKey); } catch (e) { /* storage unavailable */ } },
};

/* ============================== 3. AUDIO ============================== */
const Sound = {
  ctx: null, master: null, nextNote: 2.5, windMul: 1,
  /** Browsers only allow audio after a user gesture; called from every input handler. */
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = this.ctx = new AC();
    this.master = ctx.createGain(); this.master.connect(ctx.destination); this.setVolume(Settings.data.volume);
    const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
    // wind: looping noise through a slowly sweeping band-pass
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    this.windFilter = ctx.createBiquadFilter(); this.windFilter.type = 'bandpass'; this.windFilter.frequency.value = 420; this.windFilter.Q.value = .5;
    this.windGain = ctx.createGain(); this.windGain.gain.value = .1;
    src.connect(this.windFilter).connect(this.windGain).connect(this.master); src.start();
    // low drone
    for (const f of [55, 55.6, 82.3]) { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = f; g.gain.value = .03; o.connect(g).connect(this.master); o.start(); }
    // echo bus for the sparse notes
    const delay = ctx.createDelay(1), fb = ctx.createGain(), tone = ctx.createBiquadFilter();
    delay.delayTime.value = .43; fb.gain.value = .42; tone.type = 'lowpass'; tone.frequency.value = 1300;
    this.echo = ctx.createGain(); this.echo.connect(tone); tone.connect(this.master); tone.connect(delay); delay.connect(fb); fb.connect(tone);
  },
  setVolume(v) { if (this.master) this.master.gain.value = Math.pow(v / 10, 1.5) * .9; },
  tone(freq, dur, type = 'square', vol = .05, dest = null, attack = .004) {
    const ctx = this.ctx; if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(dest || this.master); o.start(t); o.stop(t + dur + .05);
  },
  blip() { this.tone(400 + Math.random() * 30, .04, 'square', .014); },
  ui(kind) {
    if (kind === 'move') this.tone(620, .05, 'triangle', .06);
    else if (kind === 'ok') { this.tone(440, .09, 'triangle', .07); setTimeout(() => this.tone(660, .14, 'triangle', .06), 70); }
    else if (kind === 'back') this.tone(300, .1, 'triangle', .06);
    else if (kind === 'save') { [392, 494, 587].forEach((f, i) => setTimeout(() => this.tone(f, .5, 'triangle', .05, this.echo), i * 140)); }
  },
  step(surface) {
    const ctx = this.ctx; if (!ctx) return;
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(), t = ctx.currentTime;
    s.buffer = this.noise; f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.value = (surface === 'gravel' ? 2100 : surface === 'grass' ? 520 : 950) * (.85 + Math.random() * .3);
    g.gain.setValueAtTime(surface === 'gravel' ? .11 : .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + .09);
    s.connect(f).connect(g).connect(this.master); s.start(t, Math.random() * 1.5, .1);
  },
  /** Deep bell with a long tail (the cemetery chapel). */
  bell() { for (const [f, v, d] of [[98, .16, 6], [196.5, .07, 4.5], [247, .045, 3.5], [392.8, .02, 2.5]]) this.tone(f, d, 'sine', v, this.echo, .012); },
  /** A small hitching sob; `vol` falls off with distance. */
  sob(vol = 1) { const f = 520 + Math.random() * 80; [0, .16, .3].forEach((t, i) => setTimeout(() => this.tone(f * (1 - i * .09), .13, 'sine', .024 * vol, this.echo, .03), t * 1000)); },
  /** Low dissonant swell for monsters. */
  dread(secs = 6) { for (const f of [46.2, 49, 69.3]) this.tone(f, secs, 'sawtooth', .03, null, secs * .4); },
  note() {
    const scale = [220, 261.63, 293.66, 329.63, 392, 440, 523.25, 164.81];
    const f = scale[Math.floor(Math.random() * scale.length)];
    this.tone(f, 4.5, 'triangle', .035, this.echo, .03); this.tone(f * 2, 2.5, 'sine', .012, this.echo, .03);
  },
  update(dt, t) {
    const ctx = this.ctx; if (!ctx || ctx.state !== 'running') return;
    const now = ctx.currentTime;
    this.windGain.gain.setTargetAtTime((.05 + .09 * (.5 + .5 * Math.sin(t * .23)) * (.6 + .4 * Math.sin(t * .71 + 2))) * this.windMul, now, .5);
    this.windFilter.frequency.setTargetAtTime(330 + 260 * (.5 + .5 * Math.sin(t * .13)), now, .8);
    this.nextNote -= dt;
    if (this.nextNote <= 0) { this.note(); this.nextNote = 5 + Math.random() * 9; }
  },
};

/* ============================== 4. TEXTURES ============================== */
const TEX = {};
function canvasTex(c) {
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
/** Define a 64x64 texture: per-pixel function (x,y)->[r,g,b,(a)] then optional canvas overlay pass. */
function defTex(name, pixel, overlay, w = 64, h = 64) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  if (pixel) {
    const img = ctx.createImageData(w, h), d = img.data;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const p = pixel(x, y), i = (y * w + x) * 4;
      d[i] = p[0]; d[i + 1] = p[1]; d[i + 2] = p[2]; d[i + 3] = p.length > 3 ? p[3] : 255;
    }
    ctx.putImageData(img, 0, 0);
  }
  if (overlay) overlay(ctx);
  if (w === 64) TEX[name] = canvasTex(c);
  else for (let i = 0; i < w / 64; i++) {            // wide art is sliced into 64x64 pages, like PS1 texture pages
    const s = document.createElement('canvas'); s.width = s.height = 64;
    s.getContext('2d').drawImage(c, i * 64, 0, 64, 64, 0, 0, 64, 64); TEX[name + i] = canvasTex(s);
  }
}
function dot(ctx, x, y, c, w = 1, h = 1) { ctx.fillStyle = `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function pline(ctx, x0, y0, x1, y1, c) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0;
  for (let i = 0; i <= n; i++) dot(ctx, lerp(x0, x1, i / (n || 1)), lerp(y0, y1, i / (n || 1)), c);
}
const noisy = (c, v, r) => { const n = (r() - .5) * v; return [c[0] + n, c[1] + n, c[2] + n]; };

/* 5x7 bitmap font for in-world signs; each glyph = 7 rows, one base-32 digit (5 bits) per row. */
const FONT = {
  A: 'ehhvhhh', B: 'uhhuhhu', C: 'ehggghe', D: 'uhhhhhu', E: 'vgguggv', F: 'vgguggg', G: 'ehgnhhf', H: 'hhhvhhh', I: 'e44444e',
  J: '72222ic', K: 'hikokih', L: 'ggggggv', M: 'hrllhhh', N: 'hpljhhh', O: 'ehhhhhe', P: 'uhhuggg', Q: 'ehhhlid', R: 'uhhukih',
  S: 'fgge11u', T: 'v444444', U: 'hhhhhhe', V: 'hhhhha4', W: 'hhhllrh', X: 'hha4ahh', Y: 'hha4444', Z: 'v1248gv',
  0: 'ehjlphe', 1: '4c4444e', 2: 'eh1248v', 3: 'u11e11u', 4: '26aiv22', 5: 'vgu11he', 6: '68guhhe', 7: 'v124888', 8: 'ehhehhe', 9: 'ehhf12c',
  '.': '00000cc', '-': '000v000', '>': '042v240', '<': '048v840', ':': '0cc0cc0', '!': '4444404',
};
function drawText(ctx, str, x, y, o = {}) {
  const sx = o.sx || 1, sy = o.sy || sx, pitch = o.pitch || 6 * sx, c = o.color || [255, 255, 255];
  ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
  [...str].forEach((ch, i) => {
    const g = FONT[ch]; if (!g) return;
    for (let r = 0; r < 7; r++) {
      const bits = parseInt(g[r], 32);
      for (let k = 0; k < 5; k++) if (bits & (16 >> k)) {
        const px = x + i * pitch + k * sx, py = y + r * sy;
        if (o.wear && o.wear(px, py)) continue;
        ctx.fillRect(px, py, sx, sy);
      }
    }
  });
}
const textW = (str, sx = 1, pitch = 6 * sx) => (str.length - 1) * pitch + 5 * sx;

function buildWorldTextures() {
  const R = mulberry32(1337);
  const RUST_A = [128, 76, 44], RUST_B = [82, 50, 36], PAINT = [80, 94, 106];
  const rusty = (x, y, amount, paint = PAINT) => {
    const n = .6 * vnoiseP(x / 8, y / 8, 8) + .4 * vnoiseP(x / 3.2, y / 3.2, 20);
    return n > 1 - amount ? noisy(mix3(RUST_A, RUST_B, R()), 14, R) : noisy(sh(paint, .9 + .2 * vnoiseP(x / 16, y / 4, 4, 16)), 7, R);
  };
  defTex('white', () => [255, 255, 255]);
  defTex('dark', () => noisy([24, 26, 30], 6, R));
  defTex('glow', () => [255, 244, 214]);
  defTex('asphalt', (x, y) => noisy(mix3([48, 52, 58], [66, 70, 76], vnoiseP(x / 8, y / 8, 8)), 14, R), ctx => {
    for (let k = 0; k < 3; k++) { let x = R() * 64, y = R() * 64; for (let i = 0; i < 26; i++) { dot(ctx, x, y, [26, 28, 32]); x += R() * 2 - .6; y += R() * 2 - 1; } }
  });
  defTex('sidewalk', (x, y) => {
    const seam = y % 32 === 0 || (y < 32 ? x === 0 : x === 32);
    return seam ? noisy([66, 70, 74], 8, R) : noisy(mix3([98, 102, 108], [118, 121, 124], vnoiseP(x / 8, y / 8, 8)), 10, R);
  });
  defTex('grass', (x, y) => noisy(mix3([54, 60, 50], [84, 86, 66], vnoiseP(x / 8, y / 8, 8)), 16, R), ctx => {
    for (let k = 0; k < 46; k++) dot(ctx, R() * 64, R() * 62, R() > .5 ? [102, 104, 82] : [44, 50, 42], 1, 2 + (R() * 2 | 0));
  });
  defTex('gravel', (x, y) => noisy(mix3([82, 80, 76], [106, 102, 96], vnoiseP(x / 8, y / 8, 8)), 30, R));
  defTex('rust', (x, y) => rusty(x, y, .5));
  defTex('rustdark', (x, y) => noisy(mix3([96, 60, 40], [54, 40, 36], vnoiseP(x / 4, y / 8, 16, 8)), 12, R));
  defTex('iron', (x, y) => R() > .96 ? [74, 50, 40] : noisy([30, 32, 37], 8, R));
  defTex('brick', (x, y) => {
    const row = y >> 3, xo = (row & 1) * 8, bx = (x + xo) % 16;
    if (bx === 0 || y % 8 === 0) return noisy([80, 80, 78], 8, R);
    return noisy(mix3([106, 70, 62], [80, 60, 58], hash2(((x + xo) >> 4) % 4, row)), 9, R);
  });
  const facade = boarded => (x, y) => {
    let c = noisy(mix3([94, 98, 104], [112, 116, 120], vnoiseP(x / 8, y / 8, 8)), 8, R);
    if (y === 63 || y === 0) c = sh(c, .78);
    if (x >= 16 && x < 48 && y >= 12 && y < 46) {
      const edge = x < 18 || x >= 46 || y < 14 || y >= 44 || x === 31 || x === 32;
      if (edge) c = [60, 64, 70];
      else if (boarded) c = (y % 8 === 0) ? [40, 34, 30] : noisy(mix3([92, 80, 64], [70, 60, 52], hash2(1, y >> 3)), 8, R);
      else c = ((x + y) % 23 < 3) ? [42, 50, 60] : noisy([24, 30, 38], 5, R);
    } else if (y >= 46 && y < 49 && x >= 14 && x < 50) c = [122, 126, 128];
    else if (y >= 49 && (x === 19 || x === 20 || x === 41 || x === 44)) c = sh(c, .74 + (y - 49) * .012);
    return c;
  };
  defTex('facade', facade(false));
  defTex('facade_b', facade(true));
  defTex('shutter', (x, y) => (y > 46 && vnoiseP(x / 8, y / 8, 8) > .45) ? noisy(mix3(RUST_A, RUST_B, R()), 12, R) : noisy(y % 4 < 2 ? [88, 92, 98] : [62, 66, 72], 6, R));
  defTex('wood', (x, y) => x % 16 === 0 ? [42, 36, 32] : noisy(mix3([98, 84, 68], [70, 60, 52], vnoiseP(x / 4, y / 16, 16, 4)), 8, R));
  const CAR = [70, 98, 106];
  const carPaint = (x, y) => (y > 56 - 6 * vnoiseP(x / 8, 0, 8, 1) || vnoiseP(x / 8, y / 8, 8) > .7)
    ? noisy(mix3(RUST_A, RUST_B, R()), 14, R) : noisy(mix3(CAR, sh(CAR, .78), vnoiseP(x / 16, y / 16, 4)), 7, R);
  defTex('carpaint', carPaint);
  defTex('carside', (x, y) => {
    if ((x === 20 || x === 42) && y < 50) return [28, 38, 44];
    if (y >= 50 && y < 53) return [30, 34, 38];
    if (x >= 36 && x < 40 && y >= 16 && y < 18) return [150, 154, 156];
    return carPaint(x, y);
  });
  defTex('carglass', (x, y) => {
    if (x < 3 || x > 60 || y < 4 || y > 60) return carPaint(x, 10);
    if (y > 52) return noisy([52, 58, 62], 8, R);                      // dust line along the bottom
    return ((x * 1.0 - y * .7 + 64) % 40 < 5) ? [38, 46, 56] : noisy([22, 28, 36], 4, R);
  });
  defTex('tire', (x, y) => {
    const d = Math.hypot(x - 31.5, y - 31.5);
    if (d < 9) return (Math.abs(d - 5) < 1 && ((Math.atan2(y - 31.5, x - 31.5) * 5 / Math.PI + 10) % 2 < 1)) ? [40, 42, 46] : noisy([98, 100, 104], 8, R);
    if (d < 12) return [56, 58, 62];
    return noisy([24, 24, 27], 6, R);
  });
  defTex('barrier', (x, y) => {
    let c = noisy(mix3([112, 112, 108], [130, 130, 126], vnoiseP(x / 8, y / 8, 8)), 10, R);
    if (y >= 10 && y < 18) c = mix3(c, ((x + y) % 16 < 8) ? [160, 124, 56] : [50, 50, 52], .45);
    if (hash2(x, 7) > .8) c = sh(c, .82 + .1 * R());                    // vertical grime streaks
    if (y > 50) c = sh(c, 1 - (y - 50) * .025);
    return c;
  });
  defTex('bark', (x, y) => noisy(mix3([38, 34, 33], [70, 62, 56], vnoiseP(x / 2, y / 16, 32, 4)), 8, R));
  defTex('twigs', () => [0, 0, 0, 0], ctx => {
    const grow = (x, y, a, len, depth) => {
      const x2 = x + Math.sin(a) * len, y2 = y - Math.cos(a) * len;
      pline(ctx, x, y, x2, y2, depth > 2 ? [44, 40, 38] : [56, 50, 46]);
      if (depth > 0) { grow(x2, y2, a - .35 - R() * .5, len * .72, depth - 1); grow(x2, y2, a + .35 + R() * .5, len * .72, depth - 1); if (R() > .5) grow(x2, y2, a + (R() - .5) * .3, len * .6, depth - 1); }
    };
    grow(32, 64, 0, 17, 4);
  });
  defTex('weeds', () => [0, 0, 0, 0], ctx => {
    for (let k = 0; k < 16; k++) { const x = 6 + R() * 52, hgt = 14 + R() * 40, lean = (R() - .5) * 18; pline(ctx, x, 64, x + lean, 64 - hgt, R() > .5 ? [78, 84, 62] : [100, 100, 76]); }
  });
  defTex('paintline', (x, y) => [188, 188, 178, hash2(x * 3.1, y * 1.7) > .3 && vnoiseP(x / 8, y / 8, 8) > .25 ? 255 : 0]);
  defTex('blob', (x, y) => [0, 0, 0, clamp(1.15 - Math.hypot(x - 31.5, y - 31.5) / 26, 0, 1) * 230]);
  defTex('wisp', (x, y) => {
    const e = Math.max(0, 1 - Math.hypot((x - 31.5) / 32, (y - 31.5) / 24));
    return [255, 255, 255, 255 * e * e * (.35 + .65 * vnoiseP(x / 10.67, y / 10.67, 6))];
  });
  defTex('manhole', (x, y) => {
    const d = Math.hypot(x - 31.5, y - 31.5); if (d > 29) return [0, 0, 0, 0];
    if (d > 25) return [40, 42, 46]; return ((x >> 2) + (y >> 2)) % 2 ? noisy([58, 58, 62], 6, R) : noisy([72, 70, 70], 6, R);
  });
  defTex('stain', (x, y) => [14, 14, 18, 255 * clamp(1.3 - Math.hypot(x - 31.5, y - 31.5) / 22, 0, 1) * clamp(vnoiseP(x / 8, y / 8, 8) * 1.6 - .3, 0, .8)]);
  defTex('paper', (x, y) => (y % 5 === 2 && x > 5 && x < 58 && hash2(x >> 2, y) > .25) ? [84, 84, 80] : noisy([150, 148, 136], 10, R));
  defTex('plate', (x, y) => (x < 2 || x > 61 || y < 4 || y > 59) ? [40, 42, 46] : noisy([168, 168, 156], 10, R),
    ctx => drawText(ctx, 'ASP 417', 11, 18, { sx: 1, sy: 4, color: [34, 40, 50] }));
  defTex('stripes', (x, y) => noisy(((x + y) % 32 < 16) ? [186, 184, 174] : [138, 50, 44], 12, R));
  defTex('roadclosed', (x, y) => {
    if (x < 2 || x > 61 || y < 2 || y > 61) return [60, 30, 28];
    return vnoiseP(x / 8, y / 8, 8) > .76 ? noisy(RUST_A, 16, R) : noisy([194, 192, 180], 10, R);
  }, ctx => {
    drawText(ctx, 'ROAD', 12, 10, { sx: 2, sy: 3, pitch: 11, color: [150, 44, 40] });
    drawText(ctx, 'CLOSED', 5, 36, { sx: 1, sy: 3, pitch: 9, color: [36, 36, 40] }); drawText(ctx, 'CLOSED', 6, 36, { sx: 1, sy: 3, pitch: 9, color: [36, 36, 40] });
  });
  const plank = (x, y) => (y === 0 || y === 63 || y === 21 || y === 42) ? [48, 40, 34] : noisy(mix3([112, 96, 76], [84, 72, 60], vnoiseP(x / 16, y / 3, 4, 21)), 8, R);
  defTex('cemsign_r', plank, ctx => drawText(ctx, 'CEMETERY >', 3, 22, { sx: 1, sy: 3, color: [30, 26, 26] }));
  defTex('cemsign_l', plank, ctx => drawText(ctx, '< CEMETERY', 3, 22, { sx: 1, sy: 3, color: [30, 26, 26] }));
  defTex('pharmacy', (x, y) => (y < 3 || y > 60) ? [50, 60, 58] : rusty(x, y, .3, [156, 162, 154]),
    ctx => drawText(ctx, 'PHARMACY', 6, 18, { sx: 1, sy: 4, pitch: 7, color: [36, 70, 64], wear: (x, y) => vnoiseP(x / 6, y / 6, 11) > .68 }));
  defTex('limit', (x, y) => {
    const d = Math.hypot(x - 31.5, y - 31.5); if (d > 30) return [0, 0, 0, 0];
    if (vnoiseP(x / 8, y / 8, 8) > .8) return noisy(RUST_A, 16, R);
    return d > 23 ? noisy([140, 56, 50], 10, R) : noisy([190, 190, 180], 10, R);
  }, ctx => drawText(ctx, '30', 17, 22, { sx: 3, sy: 3, pitch: 17, color: [34, 34, 38] }));
  defTex('timetable', (x, y) => {
    if (x < 3 || x > 60 || y < 3 || y > 60) return [54, 56, 60];
    if (y < 13) return [44, 56, 70];
    return noisy(mix3([182, 172, 140], [150, 138, 108], vnoiseP(x / 8, y / 8, 8)), 8, R);
  }, ctx => {
    drawText(ctx, 'BUS', 23, 5, { color: [200, 204, 200] });
    for (let r = 0; r < 7; r++) {
      const y = 18 + r * 6;
      for (let x = 7; x < 56; x += 2) if (hash2(x, r) > .35) dot(ctx, x, y, [70, 66, 60], 1, 3);
      dot(ctx, 5, y + 1, [36, 24, 24], 54, 1);                           // every row struck through with a ruler
    }
  });
  defTex('phone', (x, y) => {
    if (y < 12) return [36, 50, 70];
    if (x >= 8 && x < 20 && y >= 16 && y < 54) return (x === 8 || x === 19 || y === 16 || y === 53) ? [50, 52, 56] : [18, 18, 22];
    if (x >= 30 && x < 54 && y >= 22 && y < 50 && (x - 30) % 8 < 5 && (y - 22) % 7 < 4) return [176, 176, 170];
    if (x >= 34 && x < 50 && y >= 14 && y < 19) return [20, 30, 24];
    if (x >= 40 && x < 44 && y >= 54 && y < 60) return [14, 14, 16];
    return rusty(x, y, .22, [66, 82, 100]);
  }, ctx => drawText(ctx, 'PHONE', 17, 3, { color: [206, 210, 206] }));
  // town sign: 256x64 art sliced into four 64x64 pages (arch0..arch3)
  defTex('arch', (x, y) => {
    if (x < 2 || x > 253 || y < 2 || y > 61) return noisy([120, 126, 128], 10, R);
    const n = .55 * vnoiseP(x / 10, y / 10, 128) + .45 * vnoiseP(x / 3.5, y / 3.5, 128) + (y / 64) * .12;
    return n > .6 ? noisy(mix3(RUST_A, RUST_B, R()), 16, R) : noisy([52, 72, 86], 8, R);
  }, ctx => {
    const wear = (x, y) => vnoiseP(x / 9, y / 9, 64) > .72;
    const c = [228, 226, 206];
    drawText(ctx, 'WELCOME TO', (256 - textW('WELCOME TO', 2, 13)) / 2 | 0, 5, { sx: 2, sy: 2, pitch: 13, color: c, wear });
    drawText(ctx, 'ASPHODEL', (256 - textW('ASPHODEL', 4, 27)) / 2 | 0, 23, { sx: 4, sy: 5, pitch: 27, color: c, wear });
  }, 256, 64);
}

function buildCharacterTextures() {
  const R = mulberry32(4242);
  const SKIN = [240, 220, 210];
  const skin = x => noisy(sh(SKIN, 1 - .07 * Math.abs(x - 31.5) / 32), 3, R);
  defTex('skin', x => skin(x));
  defTex('leg', (x, y) => {                       // knee (top) -> ankle (bottom): bare skin, then a white sock
    if (y < 33) return skin(x);
    if (y < 35) return [190, 190, 196];
    return x % 4 === 0 ? [204, 204, 210] : noisy([234, 234, 232], 3, R);
  });
  defTex('shoe', (x, y) => noisy(mix3([74, 50, 42], [46, 32, 28], vnoiseP(x / 16, y / 16, 4)), 6, R));

  /** 64x64 face, planar-mapped onto the front of the head. Eyes sit at x=20/44, y~32-38. */
  const face = (name, o) => defTex(name, (x, y) => {
    const dx = Math.abs(x - 31.5) / 32;
    return noisy(sh(SKIN, 1 - .12 * dx * dx - (y > 54 ? (y - 54) * .008 : 0)), 2, R);
  }, ctx => {
    for (const s of [-1, 1]) {
      const cx = 32 + s * 12;
      const span = (a, b, y, c, hgt = 1) => dot(ctx, Math.min(cx + s * a, cx + s * b), y, c, Math.abs(b - a) + 1, hgt);   // a,b: offsets, + = outward
      const top = o.lid, rows = 40 - top;
      span(-5, 5, top + 1, [232, 230, 228], rows - 1);                    // sclera
      span(-3, 3, top + 1, o.iris, rows - 1);                             // iris
      span(-3, 3, top + 1, o.irisDark, Math.max(1, rows - 5));
      span(-1, 1, top + 2, o.pupil, Math.max(2, rows - 4));
      if (o.shine) { span(-2, -1, top + 1, [255, 255, 255], 2); span(2, 2, 38, [255, 236, 242]); }
      span(-5, 6, top - (o.heavyLid ? 1 : 0), o.lash, o.heavyLid ? 2 : 1); // upper lash line
      span(6, 6, top + 1, o.lash, 2);
      span(-4, 5, top - 3, sh(SKIN, .86));                                 // lid crease
      span(-3, 5, 40, sh(SKIN, .78));                                      // lower lid
      if (o.browArc) { span(-4, -1, o.browY + 1, o.brow); span(0, 4, o.browY, o.brow); } else span(-4, 4, o.browY, o.brow);
      if (o.blush) for (let i = -4; i <= 4; i++) for (let j = 0; j < 2; j++) if ((i + j) & 1) dot(ctx, cx + i, 43 + j, [240, 188, 184]);
    }
    dot(ctx, 32, 47, sh(SKIN, .84)); dot(ctx, 31, 48, sh(SKIN, .9));
    if (o.smile) { dot(ctx, 28, 53, o.mouth); dot(ctx, 29, 54, o.mouth, 6, 1); dot(ctx, 35, 53, o.mouth); }
    else dot(ctx, 29, 54, o.mouth, 5, 1);
  });
  face('leta_face', { lid: 33, heavyLid: true, iris: [70, 72, 80], irisDark: [44, 46, 52], pupil: [20, 20, 24], lash: [22, 22, 26],
    brow: [40, 40, 46], browY: 27, mouth: [168, 122, 120], smile: false, shine: false });
  face('mnema_face', { lid: 30, heavyLid: false, iris: [226, 150, 172], irisDark: [176, 98, 124], pupil: [112, 50, 76], lash: [92, 66, 58],
    brow: [176, 154, 124], browY: 25, browArc: true, mouth: [190, 104, 110], smile: true, shine: true, blush: true });

  /** Hair: opaque strands on top, alpha-cut zig-zag tips along the bottom edge. */
  const hair = (name, base, dark, light, seed, jag) => {
    const H = mulberry32(seed), col = [], lim = [];
    let b = .5; for (let x = 0; x < 64; x++) { b = clamp(b + (H() - .5) * .55, 0, 1); col.push(b); }
    for (let x = 0; x < 64;) { const w = 5 + (H() * 6 | 0), d = jag[0] + H() * (jag[1] - jag[0]); for (let i = 0; i < w && x < 64; i++, x++) lim[x] = 64 - d * Math.abs(i / (w - 1) * 2 - 1); }
    defTex(name, (x, y) => {
      let c = mix3(dark, base, col[x]);
      if (y >= 13 && y < 20 && col[x] > .5) c = mix3(c, light, .55);       // highlight band
      return [...sh(c, 1 - y / 64 * .16), y < lim[x] ? 255 : 0];
    });
  };
  hair('leta_hair', [30, 30, 36], [14, 14, 18], [70, 74, 88], 7, [8, 22]);
  hair('mnema_hair', [224, 210, 186], [174, 158, 136], [246, 238, 220], 11, [6, 16]);

  // --- Leta: white blouse, black ribbon, grey plaid skirt
  const fabric = (x, y) => mix3([204, 204, 212], [234, 232, 228], .5 + .5 * Math.sin(x * .5 + Math.sin(y * .15) * 2));
  defTex('leta_cloth', (x, y) => (y === 3 || y === 6) ? [186, 186, 196] : noisy(fabric(x, y), 3, R));
  defTex('leta_blouse', (x, y) => {
    let c = fabric(x, y);
    if (Math.min(Math.abs(x - 15), Math.abs(x - 48)) < 2) c = sh(c, .9);   // side seams
    if (y < 5) c = [240, 238, 234]; else if (y === 5) c = [170, 170, 180]; // collar band
    return noisy(c, 3, R);
  }, ctx => {
    const K = [22, 22, 27];
    dot(ctx, 32, 10, [196, 196, 204], 1, 54);
    for (const y of [28, 38, 48, 58]) dot(ctx, 31, y, [170, 170, 180], 2, 2);
    for (const s of [-1, 1]) for (let i = 0; i < 10; i++) {               // collar flaps
      const a = 1 + (i >> 1), b = i <= 6 ? 13 : 13 - (i - 6) * 3; if (b <= a) continue;
      dot(ctx, Math.min(32 + s * a, 32 + s * b) + (s > 0 ? 0 : 0), i, [242, 240, 236], b - a + 1, 1);
      dot(ctx, 32 + s * b, i, [164, 164, 176]);
    }
    dot(ctx, 22, 7, K, 8, 6); dot(ctx, 34, 7, K, 8, 6); dot(ctx, 24, 9, [54, 54, 62], 4, 1); dot(ctx, 36, 9, [54, 54, 62], 4, 1);
    dot(ctx, 30, 8, K, 4, 5);                                              // knot
    for (let i = 0; i < 22; i++) dot(ctx, 30 - (i * .16 | 0), 13 + i, K, 3, 1);
    for (let i = 0; i < 18; i++) dot(ctx, 32 + (i * .22 | 0), 13 + i, K, 3, 1);
  });
  defTex('leta_skirt', (x, y) => {
    const bx = x % 16, by = y % 16, vb = bx >= 6 && bx < 10, hb = by >= 6 && by < 10;
    let c = [48, 48, 53];
    if (vb || hb) c = [76, 76, 82]; if (vb && hb) c = [104, 104, 110];
    if (bx === 13 || by === 13) c = [92, 92, 98];
    if (y < 4) c = [26, 26, 30];
    return noisy(sh(c, x % 8 === 0 ? .7 : 1 - .1 * (x % 8) / 8), 4, R);     // pleats
  });

  // --- Mnema: pink knit top, burgundy tiered skirt
  const knit = (x, y) => sh([208, 162, 168], (((x + y) & 1) ? 1 : .95) * (1 - .08 * (.5 + .5 * Math.sin(x * .4 + 1))));
  defTex('mnema_cloth', (x, y) => (y < 4 || y > 59) ? [226, 196, 198] : noisy(knit(x, y), 3, R));
  defTex('mnema_top', (x, y) => {
    let c = knit(x, y);
    if ((x === 29 || x === 35) && y > 18 && y < 44) c = sh(c, .88);
    const e = Math.pow((x - 32) / 14, 2) + Math.pow(y / 16, 2);
    if (e < .6) c = sh(SKIN, .97); else if (e < 1) c = ((x + y) % 3 === 0) ? [124, 66, 88] : [84, 38, 56];
    if (y >= 57) c = (x % 4 === 1 && y % 3 === 1) ? [198, 188, 168] : [236, 228, 210];   // lace hem
    return noisy(c, 3, R);

/** Procedural animation: walk/run cycle + idle layer, scaled by each character's style. */

  const run = clamp((spd - 1.8) / 1.4, 0, 1), w = a.blend, iw = 1 - w;
  if (moving) {
    const prev = Math.sin(a.phase);
    a.phase += dt * Math.PI * 2 * spd / lerp(1.25, 2.2, run) * Math.sign(a.speed);
    if (prev * Math.sin(a.phase) < 0 && a.onStep) a.onStep();

  j.kneeL.rotation.x = Math.max(0, cs) * knee + .04 * amp; j.kneeR.rotation.x = Math.max(0, -cs) * knee + .04 * amp;
  j.armL.rotation.x = sn * arm; j.armR.rotation.x = -sn * arm;
  j.elbowL.rotation.x = -(s.elbow * (1 + run * 2.2) * w + Math.max(0, -sn) * arm * .5);
  j.elbowR.rotation.x = -(s.elbow * (1 + run * 2.2) * w + Math.max(0, sn) * arm * .5);
  j.body.position.y = ch.baseY + (Math.abs(cs) - .6) * s.bounce * w * (1 + run);
  j.body.rotation.y = -sn * s.twist * .5 * w;
  j.body.rotation.z = Math.sin(time * .8) * s.idleSway * iw;
  j.torso.rotation.set((s.hunch || 0) + s.lean * run * w, sn * s.twist * w, -Math.sin(time * .8) * s.idleSway * .6 * iw);
  j.torso.scale.y = 1 + Math.sin(time * 1.6) * s.breath;
  j.armL.rotation.z = j.armL.userData.restZ + Math.sin(time * .9) * s.idleSway * .7 * iw;
  j.armR.rotation.z = j.armR.userData.restZ - Math.sin(time * .9 + .6) * s.idleSway * .7 * iw;

  j.elbowL.rotation.x = P('eL', j.elbowL.rotation.x); j.elbowR.rotation.x = P('eR', j.elbowR.rotation.x);
  j.legL.rotation.x = P('lgL', j.legL.rotation.x, 'lg'); j.legR.rotation.x = P('lgR', j.legR.rotation.x, 'lg');

const POSES = {

  scared: t => ({ aLx: -.75, aLz: -.24, aRx: -.75, aRz: .24, eL: -2.1, eR: -2.1, hx: -.08, tx: -.1, kn: .3, lg: -.15, rz: Math.sin(t * 33) * .014 }),
  laugh:  t => ({ aRx: -.6, aRz: .22, eR: -2.05, hx: -.26 + Math.sin(t * 11) * .05, tx: -.1, by: Math.abs(Math.sin(t * 10)) * .022 }),
  reach:  t => ({ aRx: -1.5 + Math.sin(t * 17) * .025, aRz: .06, eR: -.08, hx: .14 }),
  wave:   t => ({ aRz: -2.5, eR: -.5 + Math.sin(t * 11) * .35 }),

  if (!name) return NO_POSE;
  const o = {}; for (const n of name.split('_')) if (POSES[n]) Object.assign(o, POSES[n](t));
  return o;
}

/** "Examine" script: full description the first time, a short one afterwards. */
const examine = (id, first, again, withMnema) => async g => {
  if (!g.flag('seen.' + id)) { await g.lines(first); g.setFlag('seen.' + id); } else await g.lines(again || [first[0]]);

/** Unfogged sky dome that meets the fog colour at the horizon. */

/* ============================== 9. CHAPTERS ============================== */
/* A chapter = where it starts + an opening script. Story beats are plain async functions that
   scenes hang on triggers; they get the `Script` API (talk / choice / cam / walkTo / pose / flags).
   Dialogue lists: a string is Leta's inner voice, ['L' | 'M' | 'H', text, pose?] is a spoken line
   (Leta / Mnema / the Hollow), a function is an inline action. To add Chapter 2: register its
   scenes above, then registerChapter('chapter2', { ... }) and point the 'eastroad' exit at it. */
const CHAPTERS = {};
function registerChapter(id, def) { CHAPTERS[id] = def; }

registerChapter('prologue', {
  title: 'Prologue', scene: 'city_entrance', spawn: 'start',
  async onStart(g) {
    await sleep(.9);
    await g.lines(['...', 'Asphodel.', 'The fog starts exactly where the map said the town would be.']);
  },
});

/* ---------- Chapter 1: A Voice in the Fog ----------
   Every choice quietly moves the hidden attachment counter (g.attach) and colours the next lines. */
registerChapter('chapter1', {
  title: 'Chapter 1', scene: 'main_street', spawn: 'start',
  async onStart(g) {
    await g.card('CHAPTER 1', 'A Voice in the Fog');
    await g.lines(['Main street. The shop windows are still dressed for customers.', 'Somewhere ahead, someone is crying.', 'I note it the way I would note rain.']);
  },
});

float bayer2(vec2 a) { a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }

  k(code) { return this.keys.has(code) ? 1 : 0; },

  get moveY() { return clamp(this.k('KeyW') - this.k('KeyS') + this.stick.y + this.pad.my, -1, 1); },
  get lookX() { return this.k('ArrowRight') - this.k('ArrowLeft') + this.pad.lx; },
  get lookY() { return this.k('ArrowDown') - this.k('ArrowUp') + this.pad.ly; },

  if (dx && canStand(a.x + dx, a.z)) { a.x += dx; return true; }

function rayHit(ox, oy, oz, dx, dy, dz, maxT) {

  const c = g.tri, S = g.S, ex = ox + dx * maxT, ez = oz + dz * maxT; let best = maxT;
  const cx0 = Math.floor(Math.min(ox, ex) / S), cx1 = Math.floor(Math.max(ox, ex) / S), cz0 = Math.floor(Math.min(oz, ez) / S), cz1 = Math.floor(Math.max(oz, ez) / S);
  for (let cx = cx0; cx <= cx1; cx++) for (let cz = cz0; cz <= cz1; cz++) {
    const list = g.cells.get(cx * 4096 + cz); if (!list) continue;
    for (let n = 0; n < list.length; n++) {
      const i = list[n], ax = c[i], ay = c[i + 1], az = c[i + 2];
      const e1x = c[i + 3] - ax, e1y = c[i + 4] - ay, e1z = c[i + 5] - az, e2x = c[i + 6] - ax, e2y = c[i + 7] - ay, e2z = c[i + 8] - az;
      const px = dy * e2z - dz * e2y, py = dz * e2x - dx * e2z, pz = dx * e2y - dy * e2x, det = e1x * px + e1y * py + e1z * pz;
      if (det > -1e-8 && det < 1e-8) continue;
      const inv = 1 / det, tx = ox - ax, ty = oy - ay, tz = oz - az, u = (tx * px + ty * py + tz * pz) * inv;
      if (u < 0 || u > 1) continue;
      const qx = ty * e1z - tz * e1y, qy = tz * e1x - tx * e1z, qz = tx * e1y - ty * e1x, v = (dx * qx + dy * qy + dz * qz) * inv;
      if (v < 0 || u + v > 1) continue;
      const t = (e2x * qx + e2y * qy + e2z * qz) * inv;
      if (t > .01 && t < best) best = t;
    }
  }
  return best;
}

// ---- cameras: over-the-shoulder follow camera, scripted cinematic shots, the title shot
function applyCamera(pos, look, fov) {
  camera.position.set(pos[0], pos[1], pos[2]);
  if (camera.fov !== fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
  camera.lookAt(look[0], look[1], look[2]);
}
/** Third-person camera: free orbit around Leta's right shoulder; the boom shortens before it enters a wall. */
function updateCamera(dt) {
  const c = G.cam, p = G.player, sens = .4 + Settings.data.sens * .12, inv = Settings.data.invertY ? -1 : 1;
  c.yaw -= Input.mdx * .0026 * sens; c.pitch += Input.mdy * .0022 * sens * inv;
  if (G.state === 'play') { c.yaw -= Input.lookX * 2.3 * sens * dt; c.pitch += Input.lookY * 1.5 * sens * inv * dt; }
  c.pitch = clamp(c.pitch, -.6, 1.15);
  const k = Math.min(1, dt * 16); c.x += (p.x - c.x) * k; c.z += (p.z - c.z) * k;
  const sy = Math.sin(c.yaw), cy = Math.cos(c.yaw), cp = Math.cos(c.pitch), sp = Math.sin(c.pitch);
  const dx = sy * cp, dy = -sp, dz = cy * cp, rx = -cy, rz = sy, hy = CFG.camHeight;
  const shoulder = clamp(rayHit(c.x, hy, c.z, rx, 0, rz, CFG.camShoulder + .3) - .3, 0, CFG.camShoulder);
  const ox = c.x + rx * shoulder, oz = c.z + rz * shoulder;
  let t = CFG.camDist + .35;                                               // three rays, so the edges of the view stay out of walls too
  for (const o of [0, -.22, .22]) t = Math.min(t, rayHit(ox + rx * o, hy + (o ? 0 : .12), oz + rz * o, -dx, -dy, -dz, t));
  const want = clamp(t - .35, .25, CFG.camDist);
  c.cur = want < c.cur ? want : Math.min(want, c.cur + dt * 2.5);           // snap in, ease back out
  const px = ox - dx * c.cur, py = Math.max(.22, hy - dy * c.cur), pz = oz - dz * c.cur;
  applyCamera([px, py, pz], [px + dx, py + dy, pz + dz], CFG.camFov);
  p.ch.root.visible = c.cur > .55;                                         // too close: hide her rather than look through her head
}
function setCine(c) {
  if (G.cine && !c && G.player) Object.assign(G.cam, { yaw: G.player.heading, x: G.player.x, z: G.player.z, cur: CFG.camDist });   // come back behind her
  G.cine = c; document.body.dataset.cine = c ? '1' : '0';
}
function updateCine() {
  const c = G.cine, a = typeof c.look === 'string' ? G.actors[c.look] : null;
  applyCamera(c.pos, a ? [a.x, 1.3, a.z] : c.look, c.fov); G.player.ch.root.visible = true;
}
function titleCamera() {
  const mc = G.scene.menuCam, t = G.time;                                  // slow drifting shot of the town entrance
  applyCamera([mc.pos[0] + Math.sin(t * .07) * .5, mc.pos[1] + Math.sin(t * .05) * .06, mc.pos[2]], [mc.look[0] + Math.sin(t * .045) * .5, mc.look[1], mc.look[2]], mc.fov);
}

// ---- interactions + triggers
/** The context action: the nearest interactable in range, else a companion Leta is facing. */
function findTarget() {
  const p = G.player; let best = null, bd = 1e9;
  for (const it of G.scene.interactables) for (const [x, z] of it.at) {
    const d = Math.hypot(x - p.x, z - p.z);
    if (d < (it.r || 1.4) && d < bd) { bd = d; best = { it, x, z }; }
  }
  const m = G.actors.mnema;
  if (!best && m && m.active && m.follow) {
    const dx = m.x - p.x, dz = m.z - p.z;
    if (Math.hypot(dx, dz) < 1.9 && Math.abs(angDiff(p.heading, Math.atan2(dx, dz))) < .8) best = { it: TALK_MNEMA, x: m.x, z: m.z };
  }
  return best;
}
function tryInteract() {
  const t = G.target; if (!t || G.busy) return;
  G.player.faceTo = Math.atan2(t.x - G.player.x, t.z - G.player.z); Sound.ui('ok');
  runScript(t.it.run);
}
function checkTriggers() {
  const p = G.player;
  for (const t of G.scene.triggers || []) {
    if (G.flags['trig.' + t.id] || p.x < t.rect[0] || p.x > t.rect[1] || p.z < t.rect[2] || p.z > t.rect[3]) continue;
    if (t.when && !t.when(Script)) continue;
    G.flags['trig.' + t.id] = true;
    if (t.bark) bark(t.bark[0], t.bark[1]);
    if (t.run) runScript(t.run);
    return;
  }
}
const _proj = new THREE.Vector3();
function updateHud() {
  const t = G.state === 'play' ? G.target : null, marker = $('#marker'), hint = $('#hint'), verb = t ? (t.it.verb || 'Examine') : '';
  hint.classList.toggle('hidden', !t || document.body.classList.contains('touch'));
  const A = $('#btnA'), label = Dialogue.active ? 'NEXT' : t ? verb.split(' ')[0].toUpperCase() : 'ACT';
  A.classList.toggle('hot', !!t || Dialogue.active); if (A.textContent !== label) A.textContent = label;
  if (t) _proj.set(t.x, t.it.h || 1.4, t.z).project(camera);
  marker.classList.toggle('hidden', !t || _proj.z > 1);                    // hide when the target is behind the camera
  if (!t) return;
  const u = View.u, sx = Math.round((_proj.x * .5 + .5) * View.stageW / u) * u, sy = Math.round((-_proj.y * .5 + .5) * View.stageH / u) * u;
  marker.style.left = clamp(sx, 12 * u, View.stageW - 12 * u) + 'px'; marker.style.top = clamp(sy, 36 * u, View.stageH - 10 * u) + 'px';
  const label2 = 'E  ' + verb; if (hint.textContent !== label2) hint.textContent = label2;
}

// ---- main loop
let lastT = 0;
function frame(ms) {
  requestAnimationFrame(frame);
  const now = ms / 1000, dt = Math.min(.05, now - lastT || 0); lastT = now;
  if (G.fade !== G.fadeTarget) {
    const step = G.fadeRate * dt; G.fade = Math.abs(G.fadeTarget - G.fade) <= step ? G.fadeTarget : G.fade + Math.sign(G.fadeTarget - G.fade) * step;
    if (G.fade === G.fadeTarget && G.fadeDone) { const f = G.fadeDone; G.fadeDone = null; f(); }
  }
  Sound.update(dt, now); pollGamepad();
  if (G.state === 'viewer') return viewerFrame(dt, now);
  if (!G.scene || !G.player) return;
  if (G.state !== 'paused') {
    G.time += dt;
    if (G.state === 'play') { G.playtime += dt; G.player.look = G.target; }
    Dialogue.update(dt);
    for (const id in G.actors) updateActor(G.actors[id], dt);              // the player is always first
    if (G.state === 'play') { checkTriggers(); G.target = findTarget(); }
    updateMirror();
    if (G.camMode === 'title') titleCamera(); else if (G.cine) updateCine(); else updateCamera(dt);
    G.scene.update(dt, G.time, camera);
  }
  Input.mdx = Input.mdy = 0;
  updateHud();
  renderFrame(now, G.fade);
}

// ---- model viewer (dev aid): index.html?viewer  [&anim=idle|walk|run|cry|scared|laugh|reach|wave|cry_sit] [&view=front|turn] [&zoom]
let viewerCast = [];
function startViewer(params) {
  setState('viewer'); $('#boot').classList.add('hidden');
  applyEnv({ fog: [.6, .6, .62], fogNear: 60, fogFar: 120, fogMax: 0, ambient: [.74, .74, .76], sunDir: [.3, .8, .6], sunCol: [.36, .36, .36], lampPos: [0, 50, 0], lampCol: [0, 0, 0], lampR: 1 });
  viewerCast = ['leta', 'mnema', 'hollow'].map((id, i) => { const c = CHARACTERS[id](); c.root.position.x = (i - 1) * .85; scene.add(c.root); console.info(c.name, 'triangles:', c.tris); return c; });
  viewerCast.mode = params.get('anim') || 'cycle'; viewerCast.view = params.get('view') || 'turn'; viewerCast.zoom = params.has('zoom');
  if (viewerCast.zoom) viewerCast.forEach((c, i) => { c.root.position.x = (i - 1) * .4; });
  G.fade = G.fadeTarget = 1;
  const keys = { Digit1: 'idle', Digit2: 'walk', Digit3: 'run', Digit4: 'wave', Digit5: 'laugh', Digit6: 'scared', Digit7: 'cry', Digit8: 'cry_sit', Digit9: 'reach' };
  window.addEventListener('keydown', e => { if (keys[e.code]) viewerCast.mode = keys[e.code]; });
}
function viewerFrame(dt, now) {
  G.time += dt;
  const mode = viewerCast.mode === 'cycle' ? ['idle', 'walk', 'run'][Math.floor(G.time / 4) % 3] : viewerCast.mode;
  for (const c of viewerCast) {
    c.anim.speed = mode === 'walk' ? CFG.walkSpeed : mode === 'run' ? CFG.runSpeed : 0;
    c.anim.pose = POSES[mode.split('_')[0]] ? mode : null;
    c.root.rotation.y = viewerCast.view === 'front' ? 0 : viewerCast.view === 'side' ? 1.2 : G.time * .6;
    animateCharacter(c, dt, G.time);
  }
  if (viewerCast.zoom) applyCamera([0, 1.5, 1.9], [0, 1.5, 0], 30); else applyCamera([0, .95, 4.6], [0, .9, 0], 30);
  renderFrame(now, 1);
}

/* ============================== 15. BOOT ============================== */
function boot() {
  Settings.load();
  buildWorldTextures(); buildCharacterTextures(); buildChapter1Textures();
  initRenderer(); layout(); initInput();
  window.addEventListener('resize', layout); window.addEventListener('orientationchange', () => setTimeout(layout, 200));
  const params = new URLSearchParams(location.search);
  if (params.has('viewer')) startViewer(params);
  else {
    G.player = spawnActor('leta', 0, 0, 0);
    G.player.ch.anim.onStep = () => { if (G.state === 'play') Sound.step(G.scene.surfaceAt ? G.scene.surfaceAt(G.player.x, G.player.z) : 'asphalt'); };
    const mc = CHARACTERS.leta(), mg = new THREE.Group();                  // Leta's reflection (see updateMirror)
    mg.add(mc.root); mg.scale.x = -1; mg.visible = false; scene.add(mg); G.mirror = { ch: mc, group: mg };
    drawLogo('ASPHODEL');
    $('#boot').classList.add('hidden');
    showTitle();
  }
  window.ASPHODEL = { G, THREE, SCENES, CHAPTERS, CHARACTERS, Settings, SaveSystem, Script, Input, Dialogue, camera, scene, canStand, registerScene, registerChapter };   // console / test hook
  requestAnimationFrame(frame);
}
try { boot(); } catch (e) { console.error(e); $('#boot').classList.remove('hidden'); $('#boot').textContent = 'Could not start: ' + e.message; }
</script>
