<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ASPHODEL</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --u: 3px; }                      /* one low-res (240p) pixel in CSS px, set from JS */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; }
  body { font-family: 'VT323', 'Courier New', monospace; color: #cfd6dc; }
  .hidden { display: none !important; }

  #stage { position: absolute; overflow: hidden; background: #000; }
  #view { display: block; width: 100%; height: 100%; }
  #ui { position: absolute; inset: 0; pointer-events: none; line-height: 1.1;
    font-size: max(calc(var(--u) * 12), 15px);
    text-shadow: max(calc(var(--u) * 1), 1px) max(calc(var(--u) * 1), 1px) 0 #000; }
  #ui > * { pointer-events: auto; }

  /* ---- title + menus ---- */
  #title { position: absolute; left: 0; right: 0; top: 11%; text-align: center; pointer-events: none; }
  #logo { width: 80%; image-rendering: pixelated; image-rendering: crisp-edges; }
  #footer { position: absolute; left: 3%; bottom: 2.5%; font-size: .7em; color: #5d6b78; pointer-events: none; }
  #menu { position: absolute; left: 50%; bottom: 10%; transform: translateX(-50%); min-width: 44%; }
  #menu.panel { bottom: auto; top: 50%; transform: translate(-50%, -50%); min-width: 66%; padding: .5em .4em .6em;
    background: linear-gradient(rgba(10,16,26,.93), rgba(4,8,14,.93)); border: max(var(--u), 1px) solid #8fa0ad;
    box-shadow: inset 0 0 0 max(var(--u), 1px) #1b2530, 0 0 0 max(var(--u), 1px) #000; }
  .menu-title { text-align: center; color: #a9c0cf; letter-spacing: .25em; margin-bottom: .35em; }
  .mi { display: flex; justify-content: space-between; align-items: center; gap: 1.2em; padding: .14em .7em;
    color: #7f8d99; cursor: pointer; white-space: nowrap; }
  .mi .mi-label::before { content: '\00a0\00a0'; }
  .mi.sel { color: #f2f6f8; background: linear-gradient(90deg, rgba(120,150,170,0), rgba(120,150,170,.3), rgba(120,150,170,0)); }
  .mi.sel .mi-label::before { content: '>\00a0'; }
  .mi.dis { color: #414b55; cursor: default; }
  .mi-val { display: flex; align-items: center; gap: .35em; }
  .mi-val i { font-style: normal; min-width: 5.2em; text-align: center; }
  .mi-val b { font-weight: normal; padding: 0 .45em; color: #a9c0cf; }
  .menu-help { margin: .45em .7em 0; font-size: .74em; color: #6f7f8c; white-space: normal; text-align: center; }

  /* ---- dialogue box ---- */
  #dialogue { position: absolute; left: 4%; right: 4%; bottom: 4%; min-height: 4.5em; padding: .45em .8em .55em;
    background: linear-gradient(rgba(10,16,26,.92), rgba(4,8,14,.92)); border: max(var(--u), 1px) solid #8fa0ad;
    box-shadow: inset 0 0 0 max(var(--u), 1px) #1b2530, 0 0 0 max(var(--u), 1px) #000; cursor: pointer; }
  .dlg-name { position: absolute; left: .6em; top: -1.25em; padding: 0 .5em; background: #0a1018; color: #a9c0cf;
    border: max(var(--u), 1px) solid #8fa0ad; }
  .dlg-body.inner { color: #c9d6de; }
  .dlg-body.speech { color: #f0f3f5; }
  .dlg-body.system { color: #d6c890; text-align: center; padding-top: .9em; }
  .dlg-rest { visibility: hidden; }
  .dlg-next { position: absolute; right: .7em; bottom: .35em; width: 0; height: 0; border-left: .32em solid transparent;
    border-right: .32em solid transparent; border-top: .42em solid #cfd6dc; animation: bob .8s steps(2) infinite; }
  .dlg-choices { margin-top: .2em; padding-left: 1.4em; }
  .dlg-choice { color: #7f8d99; padding: .03em .5em; }
  .dlg-choice::before { content: '\00a0\00a0'; }
  .dlg-choice.sel { color: #fff; }
  .dlg-choice.sel::before { content: '>\00a0'; }
  @keyframes bob { 50% { transform: translateY(calc(var(--u) * 2)); } }

  /* ---- in-game HUD ---- */
  #marker { position: absolute; width: 2.4em; height: 2.4em; margin: -2.9em 0 0 -1.2em; cursor: pointer; animation: bob 1s steps(2) infinite; }
  #marker i { position: absolute; left: 50%; top: 50%; width: .42em; height: .42em; margin: -.21em; transform: rotate(45deg);
    background: #e6edf1; box-shadow: 0 0 0 max(var(--u), 1px) #0a1018; }
  #hint { position: absolute; right: 3%; bottom: 3%; color: #b4c2cc; font-size: .85em; pointer-events: none; }
  #toast { position: absolute; left: 0; right: 0; top: 6%; text-align: center; color: #d6c890; pointer-events: none; }
  #boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 0 8%; color: #7f8d99; background: #000; }

  /* ---- touch controls (shown on touch devices only) ---- */
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; font-family: inherit; }
  body.touch #touch { display: block; }
  #touch > * { position: absolute; pointer-events: auto; touch-action: none; }
  #stick { left: max(18px, env(safe-area-inset-left)); bottom: 24px; width: 136px; height: 136px; border-radius: 50%;
    border: 2px solid rgba(200,215,225,.32); background: rgba(20,28,38,.34); }
  #knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px; border-radius: 50%;
    background: rgba(200,215,225,.42); border: 2px solid rgba(10,16,24,.5); }
  #btnA { right: max(22px, env(safe-area-inset-right)); bottom: 44px; width: 86px; height: 86px; border-radius: 50%;
    border: 2px solid rgba(200,215,225,.4); background: rgba(20,28,38,.4); color: rgba(225,235,240,.85);
    font-size: 24px; display: flex; align-items: center; justify-content: center; }
  #btnA.hot { background: rgba(120,150,170,.5); border-color: rgba(235,242,246,.8); }
  #btnMenu { right: max(10px, env(safe-area-inset-right)); top: max(8px, env(safe-area-inset-top)); width: 46px; height: 38px;
    border: 2px solid rgba(200,215,225,.3); background: rgba(20,28,38,.4); color: rgba(225,235,240,.8);
    font-size: 20px; display: flex; align-items: center; justify-content: center; letter-spacing: 2px; }
  body[data-state="title"] #stick, body[data-state="title"] #btnA, body[data-state="title"] #btnMenu,
  body[data-state="paused"] #stick, body[data-state="paused"] #btnA { display: none; }

  /* ---- speaker colours: Leta cold grey-blue, Mnema soft pink, monsters dim red ---- */
  #dialogue[data-voice="leta"] .dlg-body, #dialogue[data-voice="leta"] .dlg-name, #bark[data-voice="leta"] { color: #b3c8da; }
  #dialogue[data-voice="mnema"] .dlg-body, #dialogue[data-voice="mnema"] .dlg-name, #bark[data-voice="mnema"] { color: #f3b3c8; }
  #dialogue[data-voice="monster"] .dlg-body, #dialogue[data-voice="monster"] .dlg-name { color: #a23a3a; }
  #dialogue[data-voice="monster"] .dlg-body { letter-spacing: .14em; }
  #dialogue[data-voice="mnema"] .dlg-name { border-color: #b98a9a; }
  #dialogue[data-voice="monster"] .dlg-name { border-color: #6a2a2a; }
  #dialogue .dlg-choice { color: #64798a; }
  #dialogue .dlg-choice.sel { color: #dbe9f4; }

  /* ---- barks (non-blocking companion lines), chapter cards, cutscene letterbox ---- */
  #bark { position: absolute; left: 8%; right: 8%; bottom: 13%; text-align: center; pointer-events: none; }
  #card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .35em;
    pointer-events: none; color: #cfd6dc; letter-spacing: .3em; background: rgba(0,0,0,.6); }
  #card b { font-weight: normal; font-size: 1.5em; }
  #card i { font-style: normal; color: #8fa0ad; letter-spacing: .12em; }
  #ui .bar { position: absolute; left: 0; right: 0; height: 0; background: #000; transition: height .45s steps(6); pointer-events: none; }
  #ui .bar.top { top: 0; }
  #ui .bar.bot { bottom: 0; }
  body[data-cine="1"] #ui .bar { height: 8%; }
  body[data-cine="1"] #dialogue { bottom: 9%; }
  #btnA { font-size: 17px; letter-spacing: 1px; }

  /* ---- health / stamina HUD, death screen, chapter cards, combat buttons ---- */
  #hud { position: absolute; left: 3%; top: 4%; pointer-events: none; }
  #ecg { display: block; width: calc(var(--u) * 66); height: calc(var(--u) * 20); image-rendering: pixelated; image-rendering: crisp-edges;
    background: #060b10; border: max(var(--u), 1px) solid #55636e; box-sizing: content-box; }
  #hpLabel { position: absolute; left: calc(var(--u) * 72); top: 0; font-size: .82em; letter-spacing: .14em; white-space: nowrap; }
  #sta { margin-top: calc(var(--u) * 2); width: calc(var(--u) * 66); height: max(calc(var(--u) * 2), 2px); background: rgba(10,16,24,.7);
    border: max(var(--u), 1px) solid #3a4650; box-sizing: content-box; }
  #sta i { display: block; height: 100%; background: #9fb4c4; }
  #sta.low i { background: #d2564a; }
  #death { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-bottom: 16%; pointer-events: none;
    color: #a2302c; font-size: 2.7em; letter-spacing: .3em; background: radial-gradient(rgba(50,0,0,.2), rgba(0,0,0,.82)); }
  #card { opacity: 0; transition: opacity 1.4s ease-in-out; background: none; gap: .5em; }
  #card.show { opacity: 1; }
  #card b { font-size: 2.7em; letter-spacing: .34em; margin-right: -.34em; color: #e4ebf0; text-shadow: 0 0 calc(var(--u) * 6) rgba(160,190,210,.4); }
  #card b::after { content: ''; display: block; width: 72%; height: max(var(--u), 1px); margin: .22em auto 0; background: linear-gradient(90deg, transparent, #8fa0ad, transparent); }
  #card i { font-size: 1.15em; letter-spacing: .22em; color: #9fb0bd; }
  .gbtn { border: 2px solid rgba(200,215,225,.36); background: rgba(20,28,38,.4); color: rgba(225,235,240,.85); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 1px; }
  #btnAtk { right: max(118px, calc(env(safe-area-inset-right) + 96px)); bottom: 28px; width: 74px; height: 74px; }
  #btnDodge { right: max(30px, env(safe-area-inset-right)); bottom: 146px; width: 64px; height: 64px; font-size: 13px; }
  #btnInv { right: max(64px, calc(env(safe-area-inset-right) + 54px)); top: max(8px, env(safe-area-inset-top)); width: 58px; height: 38px; border-radius: 0; }
  body[data-state="title"] .gbtn, body[data-state="paused"] .gbtn, body[data-state="dead"] .gbtn,
  body[data-state="dead"] #stick, body[data-state="dead"] #btnA, body[data-state="dead"] #btnMenu { display: none; }
</style>
</head>

<script>
  // Shown if the module below (or Three.js on the CDN) fails to load.
  window.addEventListener('error', function (e) {
    var b = document.getElementById('boot');
    if (b && !b.classList.contains('hidden')) b.textContent = 'Could not start: ' + (e.message || 'failed to load Three.js from the CDN. Check your connection.');
  }, true);
</script>

<script type="module">
/* =====================================================================================================
   ASPHODEL — a PS1-style third-person horror adventure (prologue + chapter 1)

   File map (search for the section headers):
     1. CONFIG / UTILS          constants, RNG, math helpers
     2. SETTINGS + SAVE SYSTEM  localStorage
     3. AUDIO                   procedural WebAudio (wind, drone, notes, steps, blips)
     4. TEXTURES                64x64 canvas textures, bitmap font for signs
     5. PS1 MATERIAL            vertex snap, affine warp, vertex lighting, fog
     6. GEOMETRY BUILDERS       loft / box / quad + StaticBatch with baked vertex lighting
     7. CHARACTERS              Leta, Mnema, the Hollow (segmented low-poly rigs) + procedural animation and poses
     8. SCENES                  registerScene(); 'city_entrance', 'main_street', 'chapel_road'
     9. CHAPTERS                registerChapter(); 'prologue', 'chapter1', 'chapter2' (placeholder)
    10. RENDERER + POST         360p target, dither, film grain, vignette
    11. INPUT                   keyboard + mouse, gamepad, touch stick / drag-look
    12. DIALOGUE UI             typewriter text box, choices
    13. MENUS                   title, settings, pause
    14. GAME CORE               actors, third-person camera + collision, follower AI, triggers, scripts
    14b. COMBAT, MONSTERS, ITEMS, HUD
    15. BOOT
   ===================================================================================================== */
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
THREE.ColorManagement.enabled = false;          // colours are authored display-referred, no conversions

/* ============================== 1. CONFIG / UTILS ============================== */
const CFG = {
  lowH: 360, uiH: 240, aspectMin: 4 / 3, aspectMax: 16 / 9,
  walkSpeed: 1.55, runSpeed: 3.5, playerRadius: 0.28, maxHp: 100, maxSta: 100,
  camDist: 2.6, camHeight: 1.42, camShoulder: .4, camFov: 55,      // over-the-shoulder follow camera
  saveKey: 'asphodel.save.v1', settingsKey: 'asphodel.settings.v1',
};
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const sh = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
const sleep = s => new Promise(r => setTimeout(r, s * 1000));
function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function hash2(x, y) { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
/** Tileable value noise (lattice wraps every px/py cells). */
function vnoiseP(x, y, px, py = px) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const s = t => t * t * (3 - 2 * t), w = (i, p) => ((i % p) + p) % p;
  const a = hash2(w(xi, px), w(yi, py)), b = hash2(w(xi + 1, px), w(yi, py));
  const c = hash2(w(xi, px), w(yi + 1, py)), d = hash2(w(xi + 1, px), w(yi + 1, py));
  return lerp(lerp(a, b, s(xf)), lerp(c, d, s(xf)), s(yf));
}
/** Shortest signed angle from a to b. */
function angDiff(a, b) { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; }
function M(x = 0, y = 0, z = 0, ry = 0, rx = 0, rz = 0, s = 1) {
  return new THREE.Matrix4().compose(new THREE.Vector3(x, y, z),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz, 'YXZ')), new THREE.Vector3(s, s, s));
}
const mul = (...ms) => ms.reduce((a, b) => a.clone().multiply(b));

/* ============================== 2. SETTINGS + SAVE SYSTEM ============================== */
const Settings = {
  data: { volume: 7, sens: 5, invertY: false, pixel: true },
  load() { try { Object.assign(this.data, JSON.parse(localStorage.getItem(CFG.settingsKey) || '{}')); } catch (e) { /* storage unavailable */ } },
  save() { try { localStorage.setItem(CFG.settingsKey, JSON.stringify(this.data)); } catch (e) { /* storage unavailable */ } },
};
const SaveSystem = {
  read() { try { const d = JSON.parse(localStorage.getItem(CFG.saveKey)); return d && d.version === 1 ? d : null; } catch (e) { return null; } },
  exists() { return !!this.read(); },
  /** Snapshot of everything a chapter needs to resume: where, facing, flags, playtime. */
  write(G) {
    const d = { version: 1, chapter: G.chapter, scene: G.sceneId, x: G.player.x, z: G.player.z, heading: G.player.heading,
      flags: { ...G.flags }, hp: Math.round(G.hp), inv: { ...G.inv }, playtime: Math.round(G.playtime), savedAt: Date.now() };
    try { localStorage.setItem(CFG.saveKey, JSON.stringify(d)); return true; } catch (e) { return false; }
  },
  clear() { try { localStorage.removeItem(CFG.saveKey); } catch (e) { /* storage unavailable */ } },
};

/* ============================== 3. AUDIO ============================== */
const Sound = {
  ctx: null, master: null, nextNote: 2.5, windMul: 1, ambWind: 1, ambSecs: 4, amb: { wind: 1, drone: 1, pitch: 1 },
  /** Browsers only allow audio after a user gesture; called from every input handler. */
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = this.ctx = new AC();
    this.master = ctx.createGain(); this.master.connect(ctx.destination); this.setVolume(Settings.data.volume);
    const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
    // wind: looping noise through a slowly sweeping band-pass
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    this.windFilter = ctx.createBiquadFilter(); this.windFilter.type = 'bandpass'; this.windFilter.frequency.value = 420; this.windFilter.Q.value = .5;
    this.windGain = ctx.createGain(); this.windGain.gain.value = .1;
    src.connect(this.windFilter).connect(this.windGain).connect(this.master); src.start();
    // low drone
    this.droneGain = ctx.createGain(); this.droneGain.connect(this.master);
    this.drones = [55, 55.6, 82.3].map(f => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = f; g.gain.value = .03; o.connect(g).connect(this.droneGain); o.start(); return o; });
    this.ambience(this.amb, .1);
    // echo bus for the sparse notes
    const delay = ctx.createDelay(1), fb = ctx.createGain(), tone = ctx.createBiquadFilter();
    delay.delayTime.value = .43; fb.gain.value = .42; tone.type = 'lowpass'; tone.frequency.value = 1300;
    this.echo = ctx.createGain(); this.echo.connect(tone); tone.connect(this.master); tone.connect(delay); delay.connect(fb); fb.connect(tone);
  },
  setVolume(v) { if (this.master) this.master.gain.value = Math.pow(v / 10, 1.5) * .9; },
  tone(freq, dur, type = 'square', vol = .05, dest = null, attack = .004) {
    const ctx = this.ctx; if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(dest || this.master); o.start(t); o.stop(t + dur + .05);
  },
  blip() { this.tone(400 + Math.random() * 30, .04, 'square', .014); },
  ui(kind) {
    if (kind === 'move') this.tone(620, .05, 'triangle', .06);
    else if (kind === 'ok') { this.tone(440, .09, 'triangle', .07); setTimeout(() => this.tone(660, .14, 'triangle', .06), 70); }
    else if (kind === 'back') this.tone(300, .1, 'triangle', .06);
    else if (kind === 'save') { [392, 494, 587].forEach((f, i) => setTimeout(() => this.tone(f, .5, 'triangle', .05, this.echo), i * 140)); }
  },
  step(surface) {
    const ctx = this.ctx; if (!ctx) return;
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(), t = ctx.currentTime;
    s.buffer = this.noise; f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.value = (surface === 'gravel' ? 2100 : surface === 'grass' ? 520 : 950) * (.85 + Math.random() * .3);
    g.gain.setValueAtTime(surface === 'gravel' ? .11 : .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + .09);
    s.connect(f).connect(g).connect(this.master); s.start(t, Math.random() * 1.5, .1);
  },
  /** Deep bell with a long tail (the cemetery chapel). */
  bell() { for (const [f, v, d] of [[98, .16, 6], [196.5, .07, 4.5], [247, .045, 3.5], [392.8, .02, 2.5]]) this.tone(f, d, 'sine', v, this.echo, .012); },
  /** A small hitching sob; `vol` falls off with distance. */
  sob(vol = 1) { const f = 520 + Math.random() * 80; [0, .16, .3].forEach((t, i) => setTimeout(() => this.tone(f * (1 - i * .09), .13, 'sine', .024 * vol, this.echo, .03), t * 1000)); },

/* ============================== 5. PS1 MATERIAL ============================== */
/* One shader for everything: clip-space vertex snapping (jitter), partially affine UVs (texture
   warp), per-vertex lighting and distance fog. Static geometry reads lighting baked into vertex
   colours (aColor / aLamp); characters compute the same lighting per vertex at runtime. */
const SHARED = {
  uSnap: { value: new THREE.Vector2(160, 120) }, uAffine: { value: 0.5 },
  uFogColor: { value: new THREE.Vector3(.44, .49, .54) }, uFogNear: { value: 4 }, uFogFar: { value: 46 }, uFogMax: { value: .96 },
  uAmbient: { value: new THREE.Vector3(.6, .6, .6) }, uSunDir: { value: new THREE.Vector3(0, 1, 0) }, uSunCol: { value: new THREE.Vector3() },
  uLampPos: { value: new THREE.Vector3() }, uLampCol: { value: new THREE.Vector3() }, uLampR: { value: 1 }, uFlicker: { value: 1 },
  uFlashPos: { value: new THREE.Vector3() }, uFlashDir: { value: new THREE.Vector3(0, 0, 1) }, uFlashCol: { value: new THREE.Vector3() },   // Leta's flashlight
};
const PS1_VS = `
uniform vec2 uSnap; uniform float uAffine;
varying vec3 vUvw; varying vec3 vLight; varying vec3 vLampL; varying float vDist; varying vec3 vWorld; varying vec3 vNrm;
#ifdef BAKED
attribute vec3 aColor; attribute vec3 aLamp;
#else
uniform vec3 uAmbient; uniform vec3 uSunDir; uniform vec3 uSunCol; uniform vec3 uLampPos; uniform vec3 uLampCol; uniform float uLampR;
#endif
void main() {
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vec4 mv = viewMatrix * wp;
  vec4 clip = projectionMatrix * mv;
  clip.xy = floor(clip.xy / clip.w * uSnap + 0.5) / uSnap * clip.w;      // snap to the 240p pixel grid
  gl_Position = clip;
  float W = mix(1.0, max(clip.w, 0.05), uAffine);                        // W=1: perspective-correct, W=w: fully affine
  vUvw = vec3(uv * W, W);
  vDist = length(mv.xyz);
  vWorld = wp.xyz; vNrm = mat3(modelMatrix) * normal;
#ifdef BAKED
  vLight = aColor; vLampL = aLamp;
#else
  vec3 n = normalize(mat3(modelMatrix) * normal);
  vLight = (uAmbient * (0.72 + 0.28 * n.y) + uSunCol * max(dot(n, uSunDir), 0.0)) * 1.2;   // characters read a little brighter than the set
  vec3 L = uLampPos - wp.xyz; float d = length(L); float att = max(0.0, 1.0 - d / uLampR);
  vLampL = uLampCol * att * att * (0.3 + 0.7 * max(dot(n, L / d), 0.0));
#endif
}`;
const PS1_FS = `
uniform sampler2D map; uniform vec3 uFogColor; uniform float uFogNear; uniform float uFogFar; uniform float uFogMax;

/** Unfogged sky dome that meets the fog colour at the horizon. */
function addSky(B, env) {
  const zen = [env.fog[0] * .66, env.fog[1] * .7, env.fog[2] * .78];
  B.add('sky', loftData([{ y: -6, r: 170 }, { y: 10, r: 170 }, { y: 75, r: 70 }, { y: 95, r: 1 }], 12, { inward: true }), null,
    { unlit: true, tint: p => mix3(env.fog, zen, clamp((p.y - 10) / 60, 0, 1)) });
}
/** Coarse 8 m ground out to the fog limit, around a finely tiled inner rect [x0,x1,z0,z1] (multiples of 8).
    With a free camera the player can look anywhere, so the ground must never visibly end. */
function addGroundRing(B, inner, surf, tint, R = 104) {
  const cols = []; for (let x = -R; x <= R; x += 8) cols.push(x);
  cols.push(-4, 4); cols.sort((a, b) => a - b);                              // keep the road its real width
  for (let i = 0; i < cols.length - 1; i++) for (let z = -R; z < R; z += 8) {
    const x0 = cols[i], x1 = cols[i + 1], cx = (x0 + x1) / 2, cz = z + 4;
    if (cx > inner[0] && cx < inner[1] && cz > inner[2] && cz < inner[3]) continue;
    B.add(surf(cx, cz), quadData([x0, 0, z + 8], [x1, 0, z + 8], [x1, 0, z], [x0, 0, z], { uv: [0, 0, (x1 - x0) / 2, 4] }), null, { tint });
  }
}
function addBuilding(B, x0, x1, z0, z1, h, tex = 'facade', tint = [1, 1, 1], faces = ['px', 'nx', 'pz', 'nz']) {
  const m = M((x0 + x1) / 2, 0, (z0 + z1) / 2), w = x1 - x0, d = z1 - z0;
  B.box(tex, w, h, d, m, { uvm: [3, 3], faces, tint, ao: .6 });
  B.box('asphalt', w, h, d, m, { faces: ['py'], tint: sh(tint, .6) });
  B.box('sidewalk', w + .3, .25, d + .3, M((x0 + x1) / 2, h, (z0 + z1) / 2), { tint: sh(tint, .7) });
  if (tint[0] < .8) return;

  const S = 1.8, y = .014, strip = (a, b, c, e) => B.add('wallshadow', quadData(a, b, c, e), null, { unlit: true });
  strip([x0, y, z1 + S], [x1, y, z1 + S], [x1, y, z1], [x0, y, z1]); strip([x1, y, z0 - S], [x0, y, z0 - S], [x0, y, z0], [x1, y, z0]);

}

/** Drifting ground mist, slow ash around the camera and the lamp flicker. Returns the per-frame update. */
function makeAtmosphere(extras, rng, b, mistN = 9) {
  const mist = [];
  for (let i = 0; i < mistN; i++) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(9 + rng() * 6, 2.2 + rng() * 1.4), ps1Mat('mist'));
    m.position.set(lerp(b[0], b[1], rng()), .9 + rng() * .6, lerp(b[2], b[3], rng())); m.userData.v = (.12 + rng() * .2) * (rng() > .5 ? 1 : -1);
    mist.push(m); extras.add(m);
  }
  const N = 200, pos = new Float32Array(N * 3), seed = new Float32Array(N * 3);
  for (let i = 0; i < N * 3; i++) seed[i] = rng();
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const ash = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xaeb8c2, size: 1, sizeAttenuation: false, fog: true, transparent: true, opacity: .7, depthWrite: false }));
  ash.frustumCulled = false; extras.add(ash);
  let flick = 1, flickT = 0;
  const wrap = (v, c, s) => c + (((v - c) % s) + s) % s - s / 2;
  return (dt, t, cam) => {
    flickT -= dt;
    if (flickT <= 0) { flick = Math.random() < .3 ? .1 + Math.random() * .5 : 1; flickT = flick < 1 ? .03 + Math.random() * .15 : .2 + Math.random() * 2.2; }
    SHARED.uFlicker.value = flick;
    for (const m of mist) {
      m.position.x += m.userData.v * dt; if (m.position.x > b[1] + 4) m.position.x = b[0] - 4; if (m.position.x < b[0] - 4) m.position.x = b[1] + 4;
      m.rotation.y = Math.atan2(cam.position.x - m.position.x, cam.position.z - m.position.z);
    }
    for (let i = 0; i < N; i++) {                                           // the ash lives in a 28 m box that follows the camera
      const k = i * 3;
      pos[k] = wrap(seed[k] * 28 + Math.sin(t * .5 + i) * .3, cam.position.x, 28);
      pos[k + 1] = (((seed[k + 1] * 7 - t * (.22 + (i % 5) * .03)) % 7) + 7) % 7;
      pos[k + 2] = wrap(seed[k + 2] * 28, cam.position.z, 28);
    }
    geo.attributes.position.needsUpdate = true;
  };
}

/* ============================== 10. RENDERER + POST ============================== */
/* Pipeline: scene -> 240p target (nearest) -> "signal" pass at 240p (VHS line jitter, chroma
   fringe, grain, 15-bit ordered dither) -> present pass (sharp upscale, scanlines, vignette, fade). */
const View = { stageW: 640, stageH: 480, aspect: 4 / 3, u: 2 };
let renderer, scene, camera, rtScene = null, rtSignal = null, signalPass, presentPass, postCam, postQuad;
const POST_VS = `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const SIGNAL_FS = `
uniform sampler2D tScene; uniform vec2 uRes; uniform float uTime; uniform float uLoFi;
varying vec2 vUv;
float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float bayer2(vec2 a) { a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
float bayer4(vec2 a) { return bayer2(0.5 * a) * 0.25 + bayer2(a); }
void main() {
  vec2 px = floor(vUv * uRes);
  float tick = floor(uTime * 30.0);
  float tear = step(0.994, hash(vec2(px.y * 0.37, tick)));                                   // rare one-line tear
  float band = step(abs(fract(vUv.y + uTime * 0.06) - 0.5), 0.008) * step(0.6, hash(vec2(px.y, tick)));   // slow tracking band
  vec2 uv = (px + 0.5 + vec2((tear * 2.0 + band) * uLoFi, 0.0)) / uRes;
  float ca = (vUv.x - 0.5) * 0.7 * uLoFi / uRes.x;                                           // chroma fringe toward the edges
  vec3 c = vec3(texture2D(tScene, uv + vec2(ca, 0.0)).r, texture2D(tScene, uv).g, texture2D(tScene, uv - vec2(ca, 0.0)).b);
  c += (hash(px + fract(uTime) * 91.7) - 0.5) * (0.035 + 0.035 * uLoFi + band * 0.08);       // grain
  c = floor(c * 31.0 + bayer4(px)) / 31.0;                                                   // 5 bits per channel, ordered dither
  gl_FragColor = vec4(c, 1.0);
}`;
const PRESENT_FS = `
uniform sampler2D tSignal; uniform vec2 uRes; uniform vec2 uOut; uniform float uScan; uniform float uFade; uniform vec4 uFlash;
varying vec2 vUv;
void main() {
  vec2 p = vUv * uRes, f = fract(p), sc = max(uOut / uRes, vec2(1.0));
  vec2 q = floor(p) + clamp(f * sc, 0.0, 0.5) + clamp((f - 1.0) * sc + 0.5, 0.0, 0.5);       // sharp-bilinear upscale
  vec3 c = texture2D(tSignal, q / uRes).rgb;
  c *= 1.0 - uScan * (0.5 - 0.5 * cos(p.y * 6.2831853));                                     // scanlines
  vec2 d = vUv - 0.5; c *= 1.0 - dot(d, d) * 0.8;                                            // vignette
  c = mix(c, uFlash.rgb, uFlash.a);                                                          // hit / hurt flash
  gl_FragColor = vec4(c * uFade, 1.0);
}`;

  renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
  scene = new THREE.Scene(); scene.fog = new THREE.Fog(0x707d8a, 4, 46);                     // only used by wires + ash

const Dialogue = {

  /** Show one box of text. o.who = speaker tag, o.cls = inner | speech | system, o.choices = [..] -> resolves to the index. */

      Object.assign(this, { active: true, typing: true, full: text, n: 0, acc: 0, resolve: res, choices: o.choices || null, sel: 0, t0: performance.now() });

}
/** Back to the last checkpoint (or the very beginning if there is none). */
function retry() { Menu.closeAll(); if (SaveSystem.exists()) continueGame(); else startNewGame(); }
function resetPlayer() {
  const pc = G.player.ch; pc.anim.clip = null; pc.anim.pose = null; pc.anim.pk = {}; pc.root.rotation.x = 0;
  Object.assign(G, { act: { type: null, t: 0 }, sta: CFG.maxSta, staDelay: 0, invuln: 0, hitstop: 0, shake: 0 });
}
/** Show what she is carrying: the plank in her hand, the attack button on touch screens. */
function syncLoadout() {
  const has = !!G.flags['has.plank'];
  G.player.ch.joints.weapon.visible = has; $('#btnAtk').classList.toggle('hidden', !has);
}
/** Mnema cannot be hurt and nothing goes for her, but she is frightened all the same. */
function updateCompanion() {
  const m = G.actors.mnema; if (!m || !m.active || !m.follow) return;
  const threat = monsters().some(e => !MON[e.mon.kind].passive && e.mon.state !== 'idle' && Math.hypot(e.x - m.x, e.z - m.z) < 12);
  m.ch.anim.pose = threat && m.vel < .3 ? 'scared' : null;
  if (threat && !G.flags['bark.fight']) { G.flags['bark.fight'] = true; bark('Mnema', 'Leta—! Leta, look out!'); }
}

// ---- items, pickups, inventory
const pickupMesh = (data, tex) => new THREE.Mesh(toGeometry(data), ps1Mat(tex));
const PICKUP_MESH = {
  bandage: () => pickupMesh(loftData([{ y: 0, r: .07 }, { y: .1, r: .07 }], 8, { capEnd: true }), 'bandage'),
  medkit: () => pickupMesh(boxData(.36, .2, .24, { fit: true }), 'medkit'),
  flower: () => pickupMesh(appendData(quadData([-.3, 0, 0], [.3, 0, 0], [.3, .55, 0], [-.3, .55, 0]), quadData([0, 0, .3], [0, 0, -.3], [0, .55, -.3], [0, .55, .3])), 'paleflower'),
  plank: () => pickupMesh(boxData(.1, 1, .034, { uvm: [.5, 1] }), 'wood'),
};
/** Create the scene's pickups (scene.pickups: [{ id, type, x, z, y?, ry?, rz? }]); taken ones stay hidden. */
function buildPickups() {
  for (const p of G.scene.pickups || []) {
    p.mesh = PICKUP_MESH[p.type](); p.mesh.position.set(p.x, p.y || 0, p.z); p.mesh.rotation.set(0, p.ry || 0, p.rz || 0);
    p.mesh.visible = !G.flags['got.' + p.id]; G.scene.group.add(p.mesh);
    p.it = { id: p.id, verb: 'Take', h: (p.y || 0) + .6, run: g => takePickup(g, p) };
  }
}
async function takePickup(g, p) {
  const touch = document.body.classList.contains('touch');
  G.flags['got.' + p.id] = true; p.mesh.visible = false; Sound.pickup();
  if (p.type === 'plank') {
    G.flags['has.plank'] = true; syncLoadout();
    await g.lines(['A plank, torn off a shutter. One end is split to a point.', 'I have no use for it. I take it anyway.']);
    return g.system(touch ? 'ATK: swing (hold for a heavy swing).  DODGE: dodge.' : 'J / left click: swing.   K / right click: heavy swing.   SPACE: dodge.');
  }
  G.inv[p.type]++; const it = ITEMS[p.type];
  if (!g.flag('seen.item.' + p.type)) { g.setFlag('seen.item.' + p.type); await g.say(it.note); }
  await g.system('Took: ' + it.name + '.   (' + (touch ? 'ITEM' : 'I') + ': inventory)');
}
function useItem(k) {
  if (!G.inv[k]) return;
  if (G.hp >= CFG.maxHp) { toast('No need for that now.'); return; }
  G.inv[k]--; G.hp = Math.min(CFG.maxHp, G.hp + ITEMS[k].heal); Sound.heal(); toast(ITEMS[k].name + ' used.');
}
const hpState = () => G.hp > 60 ? ['FINE', '#72c98e', 1.1] : G.hp > 30 ? ['CAUTION', '#d6bf58', 1.5] : G.hp > 0 ? ['DANGER', '#d2564a', 2.2] : ['', '#d2564a', 0];
const inventoryMenu = nested => ({
  title: 'INVENTORY', panel: true, onBack() { if (!nested) { setState('play'); lockPointer(); } },
  items: [
    ...Object.keys(ITEMS).map(k => ({ label: ITEMS[k].name, value: () => 'x' + G.inv[k], disabled: () => !G.inv[k], select() { useItem(k); } })),
    { label: 'Close', select() { Menu.back(); } },
  ],
  help: () => 'Condition: ' + hpState()[0] + '.   ' + (G.flags['has.plank'] ? 'Weapon: wooden plank.' : 'No weapon.') + '   Select an item to use it.',
});
const deathMenu = () => ({ items: [{ label: 'Retry', select() { retry(); } }, { label: 'Quit to Title', select() { quitToTitle(); } }] });
function openInventory() { if (G.state !== 'play') return; Sound.ui('ok'); setState('paused'); unlockPointer(); Menu.open(inventoryMenu()); }

// ---- lights, effects, HUD
/** Lamps of a scene: env.lamps, or the single classic lamp. `steady` lamps do not flicker. */
function envLamps(env) { return env.lamps || [{ pos: env.lampPos, col: env.lampCol, r: env.lampR }]; }
/** Leta's flashlight, and the street lamp that lights the characters (whichever is nearest to her). */
function updateLights() {
  const p = G.player, sy = Math.sin(p.heading), cy = Math.cos(p.heading), on = G.light && G.camMode === 'game', k = on ? (G.scene.def.env.flash ?? .5) : 0;
  SHARED.uFlashPos.value.set(p.x + sy * .2, 1.28, p.z + cy * .2); SHARED.uFlashDir.value.set(sy * .985, -.17, cy * .985);
  SHARED.uFlashCol.value.set(1.05 * k, .98 * k, .8 * k); p.ch.joints.beam.visible = on;
  let best = null, bd = 1e9;
  for (const L of envLamps(G.scene.def.env)) { const d = Math.hypot(L.pos[0] - p.x, L.pos[2] - p.z); if (d < bd) { bd = d; best = L; } }
  SHARED.uLampPos.value.set(...best.pos); SHARED.uLampCol.value.set(...best.col); SHARED.uLampR.value = best.r;
}
/** A short additive flash in the world (hit sparks, shock rings). */
function addFx(x, y, z, s0, s1, dur) {
  let f = G.fx.find(f => f.t >= f.dur);
  if (!f) { f = { mesh: new THREE.Mesh(new THREE.PlaneGeometry(1, 1), ps1Mat('spark')) }; scene.add(f.mesh); G.fx.push(f); }
  Object.assign(f, { t: 0, dur, s0, s1 }); f.mesh.position.set(x, y, z); f.mesh.visible = true;
}
function updateFx(dt) {
  for (const f of G.fx) {
    if (f.t >= f.dur) continue;
    f.t += dt; f.mesh.visible = f.t < f.dur; f.mesh.scale.setScalar(lerp(f.s0, f.s1, f.t / f.dur)); f.mesh.quaternion.copy(camera.quaternion);
  }
}
let ecgX = 0, ecgPh = 0, ecgY0 = 12;
/** Health as a heart trace (Fine / Caution / Danger) and the stamina bar under it. */
function drawHud(dt) {
  const hud = $('#hud'), show = G.camMode === 'game' && !G.cine && G.fade > .5 && (G.state === 'play' || G.state === 'dialogue' || G.state === 'dying');
  hud.classList.toggle('hidden', !show); if (!show) return;
  const st = hpState(), c = $('#ecg'), ctx = c.getContext('2d'), W = c.width, H = c.height, lab = $('#hpLabel');
  for (let n = Math.max(1, Math.round(dt * 44)); n > 0; n--) {             // sweep, like a monitor; the pulse quickens as she weakens
    const p = ecgPh = (ecgPh + st[2] / 44) % 1;
    const wave = p < .06 ? Math.sin(p / .06 * Math.PI) * 2 : p > .12 && p < .15 ? -2 : p >= .15 && p < .2 ? H * .5 : p >= .2 && p < .24 ? -4 : p > .34 && p < .46 ? Math.sin((p - .34) / .12 * Math.PI) * 3 : 0;
    const y = Math.round(H * .64 - (st[2] ? wave : 0));
    ctx.fillStyle = '#060b10'; ctx.fillRect(ecgX, 0, 1, H); ctx.fillRect((ecgX + 1) % W, 0, 4, H);
    ctx.fillStyle = st[1]; ctx.fillRect(ecgX, Math.min(y, ecgY0), 1, Math.abs(y - ecgY0) + 1);
    ecgY0 = y; ecgX = (ecgX + 1) % W;
  }
  if (lab.textContent !== st[0]) { lab.textContent = st[0]; lab.style.color = st[1]; }
  $('#sta i').style.width = (G.sta / CFG.maxSta * 100) + '%';
}
/** Mouse buttons and the extra touch buttons. */
function initCombatInput() {
  window.addEventListener('mousedown', e => { if (G.state === 'play' && document.pointerLockElement && e.button !== 1) playerAct(e.button === 2 ? 'heavy' : 'light'); });
  const atk = $('#btnAtk'); let t0 = 0;
  atk.addEventListener('pointerdown', e => { e.preventDefault(); Sound.unlock(); t0 = performance.now(); });
  atk.addEventListener('pointerup', e => { e.preventDefault(); playerAct(performance.now() - t0 > 320 ? 'heavy' : 'light'); });   // hold = heavy
  $('#btnDodge').addEventListener('pointerdown', e => { e.preventDefault(); Sound.unlock(); onButton('dodge'); });
  $('#btnInv').addEventListener('pointerdown', e => { e.preventDefault(); Sound.unlock(); onButton('inv'); });
}

/* ============================== 15. BOOT ============================== */
function boot() {
  Settings.load();
  buildWorldTextures(); buildCharacterTextures(); buildChapter1Textures(); buildUpdateTextures();
  initRenderer(); layout(); initInput(); initCombatInput();
  window.addEventListener('resize', layout); window.addEventListener('orientationchange', () => setTimeout(layout, 200));
  const params = new URLSearchParams(location.search);
  if (params.has('viewer')) startViewer(params);
  else {
    G.player = spawnActor('leta', 0, 0, 0);
    G.player.ch.anim.onStep = () => { if (G.state === 'play') Sound.step(G.scene.surfaceAt ? G.scene.surfaceAt(G.player.x, G.player.z) : 'asphalt'); };
    const mc = CHARACTERS.leta(), mg = new THREE.Group();                  // Leta's reflection (see updateMirror)
    mg.add(mc.root); mg.scale.x = -1; mg.visible = false; scene.add(mg); G.mirror = { ch: mc, group: mg };
    drawLogo('ASPHODEL');
    $('#boot').classList.add('hidden');
    showTitle();
  }
  window.ASPHODEL = { G, THREE, SCENES, CHAPTERS, CHARACTERS, Settings, SaveSystem, Script, Input, Dialogue, camera, scene, canStand, registerScene, registerChapter, playerAct, damagePlayer, spawnMonster, monsters, MON };   // console / test hook
  requestAnimationFrame(frame);
}
try { boot(); } catch (e) { console.error(e); $('#boot').classList.remove('hidden'); $('#boot').textContent = 'Could not start: ' + e.message; }
</script>
